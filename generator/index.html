  /* ---------- 状态栏 ---------- */
  function _setStat(id,text){
    var el=_q(id);
    if(el) el.textContent=text;
  }
  function _readZoom(){
    var vp=_q('viewport');
    if(!vp) return 1;
    var m=/scale\(([\d.]+)\)/.exec(vp.getAttribute('transform')||'');
    return m?parseFloat(m[1]):1;
  }
  function updateStatusBar(){
    var docs=XTR.graph.getDocs();
    if(!docs||!docs.pipeline) return;
    _setStat('st-nodes',(docs.pipeline.nodes||[]).length+' 个节点');
    _setStat('st-edges',(docs.pipeline.edges||[]).length+' 条连线');
    _setStat('st-zoom','缩放 '+Math.round(_readZoom()*100)+'%');
    if(nameInput&&nameInput!==document.activeElement){
      var nm=(docs.pipeline.meta&&docs.pipeline.meta.name)||'';
      if(nameInput.value!==nm) nameInput.value=nm;
    }
    var txt='通过',cls='ok';
    try{
      var errs=[];
      var r1=XTR.validate.checkSchema('pipeline',docs.pipeline);
      (r1&&r1.errors||[]).forEach(function(e){ errs.push(e); });
      var r2=XTR.validate.pipelinePreflight(docs.pipeline);
      (r2&&r2.errors||[]).forEach(function(e){ errs.push(typeof e==='string'?{message:e}:e); });
      var warns=(r2&&r2.warnings)||[];
      if(errs.length){ txt=errs.length+' 个错误'; cls='err'; }
      else if(warns.length){ txt=warns.length+' 个警告'; cls='warn'; }
    }catch(e){}
    var el=_q('st-valid');
    if(el){ el.textContent='校验：'+txt; el.className='st-'+cls; }
  }
  window.XTR.ui={
    mount:mount,
    toast:toast,
    confirm:confirm,
    modal:modal,
    updateStatusBar:updateStatusBar,
    openHelp:openHelp,
    copyText:copyText
  };
})();

/* ================= 分区 11：导入 / 导出 ================= */
(function(){
  var U=XTR.util;
  var SCHEMA_VERSION='1.0.0';
  var fileInput=null;
  function _ensureInput(){
    if(fileInput) return fileInput;
    fileInput=document.createElement('input');
    fileInput.type='file';
    fileInput.multiple=true;
    fileInput.accept='.json,application/json';
    fileInput.style.display='none';
    document.body.appendChild(fileInput);
    fileInput.addEventListener('change',function(){
      var files=Array.prototype.slice.call(fileInput.files||[]);
      fileInput.value='';
      if(files.length) importFiles(files);
    });
    return fileInput;
  }
  function pickFiles(){ _ensureInput().click(); }
  function download(text,filename,mime){
    var blob=new Blob([text],{type:mime||'application/json;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;
    a.download=filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); },1000);
  }
  function safeFilename(name){
    var s=String(name==null?'':name);
    s=s.replace(/[\\\/\:\*\?\"\<\>\|\x00-\x1f]/g,'_');
    s=s.replace(/^\s+|\s+$/g,'');
    return s||'pipeline';
  }
  function _baseName(doc){
    return safeFilename((doc&&doc.meta&&doc.meta.pipeline_id)||'pipeline');
  }
  function _schemaErrors(kind,doc){
    var out=[];
    try{
      var r=XTR.validate.checkSchema(kind,doc);
      (r&&r.errors||[]).forEach(function(e){
        if(e&&typeof e==='object') out.push({path:e.path||'',message:e.message||String(e)});
        else out.push({path:'',message:String(e)});
      });
    }catch(e){
      out.push({path:'$',message:'校验器异常：'+e.message});
    }
    return out;
  }
  function _preflightErrors(doc){
    var out=[];
    try{
      var r=XTR.validate.pipelinePreflight(doc);
      (r&&r.errors||[]).forEach(function(e){
        if(e&&typeof e==='object') out.push({path:e.path||'',message:e.message||String(e)});
        else out.push({path:'',message:String(e)});
      });
    }catch(e){}
    return out;
  }
  function _errListBody(errs,intro){
    var body=document.createElement('div');
    var p=document.createElement('p');
    p.textContent=intro.replace('{n}',String(errs.length));
    body.appendChild(p);
    var ul=document.createElement('ul');
    ul.className='err-list';
    errs.slice(0,10).forEach(function(e){
      var li=document.createElement('li');
      li.textContent=(e.path?'['+e.path+'] ':'')+(e.message||'');
      ul.appendChild(li);
    });
    body.appendChild(ul);
    if(errs.length>10){
      var more=document.createElement('p');
      more.textContent='……其余 '+(errs.length-10)+' 条略。';
      body.appendChild(more);
    }
    return body;
  }
  function _exportWithCheck(kind,doc,filename,done){
    if(kind==='layout'){ try{ _syncLayoutState(); }catch(e){} }
    var errs=_schemaErrors(kind,doc);
    if(kind==='pipeline') errs=errs.concat(_preflightErrors(doc));
    function doDownload(){
      download(XTR.model.serialize(doc),filename,'application/json;charset=utf-8');
      if(done) done();
    }
    if(errs.length){
      XTR.ui.modal({
        title:'Schema 校验未通过',
        body:_errListBody(errs,'导出前自检发现 {n} 个问题：'),
        buttons:[
          {label:'仍然导出',type:'primary',onClick:function(){ doDownload(); }},
          {label:'返回修改',onClick:function(){}}
        ]
      });
      return;
    }
    doDownload();
  }
  function _syncLayoutState(){
    var docs=XTR.graph.getDocs();
    if(!docs||!docs.pipeline||!docs.layout) return;
    var tr=null;
    try{ tr=XTR.view.getTransform(); }catch(e){}
    if(tr){
      if(!docs.layout.viewport) docs.layout.viewport={x:0,y:0,zoom:1};
      docs.layout.viewport.x=Math.round(tr.x*100)/100;
      docs.layout.viewport.y=Math.round(tr.y*100)/100;
      docs.layout.viewport.zoom=Math.round(tr.k*1000)/1000;
    }
  }
  function exportPipeline(){
    var docs=XTR.graph.getDocs();
    _exportWithCheck('pipeline',docs.pipeline,_baseName(docs.pipeline)+'.pipeline.json',function(){
      XTR.ui.toast('已导出管线文件','success');
    });
  }
  function exportLayout(){
    var docs=XTR.graph.getDocs();
    _exportWithCheck('layout',docs.layout,_baseName(docs.pipeline)+'.layout.json',function(){
      XTR.ui.toast('已导出布局文件','success');
    });
  }
  function exportBoth(){
    var docs=XTR.graph.getDocs();
    _exportWithCheck('pipeline',docs.pipeline,_baseName(docs.pipeline)+'.pipeline.json',function(){
      setTimeout(function(){
        _exportWithCheck('layout',docs.layout,_baseName(docs.pipeline)+'.layout.json',function(){
          XTR.ui.toast('已下载 2 个文件','success');
        });
      },120);
    });
  }
  /* ══════ 内部 v1 → 流谱格式（flowscore.pipeline）══════ */
  function v1ToFlow(docs){
    var p=(docs&&docs.pipeline)||{}, lay=((docs&&docs.layout)||{}).nodes||{};
    var X=(p.x&&p.x.flow)||{}, XN=p.x&&p.x.nodes||{};
    var NODES=(p.nodes||[]).slice();
    var idx={}; NODES.forEach(function(n,i){ idx[n.id]=i; });
    /* 阅读顺序：按画布 y→x 排；没有布局就按原序 */
    NODES.sort(function(a,b){
      var sa=(XN[a.id]||{}).seq, sb=(XN[b.id]||{}).seq;
      var ha=(sa==null?1e6:sa), hb=(sb==null?1e6:sb);
      if(ha!==hb) return ha-hb;
      var A=lay[a.id]||{}, B=lay[b.id]||{};
      if(A.y!=null&&B.y!=null){ if(A.y!==B.y) return A.y-B.y; if(A.x!==B.x) return A.x-B.x; }
      return idx[a.id]-idx[b.id];
    });
    var seq={}; NODES.forEach(function(n,i){ seq[n.id]=i+1; });
    var IN={};
    (p.edges||[]).forEach(function(e){
      IN[e.to]=IN[e.to]||{};
      (IN[e.to][e.to_port]=IN[e.to][e.to_port]||[]).push({ node:e.from, port:e.from_port });
    });
    var OUT={};
    (p.edges||[]).forEach(function(e){
      OUT[e.from]=OUT[e.from]||[];
      OUT[e.from].push({ port:e.from_port, node:e.to, toPort:e.to_port });
    });
    var PROVIDER_REV={ 'https://api.deepseek.com/v1':'deepseek',
      'https://open.bigmodel.cn/api/paas/v4':'glm', 'https://api.moonshot.cn/v1':'kimi',
      'https://dashscope.aliyuncs.com/compatible-mode/v1':'qwen' };
    function _pE(n,port){ return ((XN[n.id]||{}).ports||{})[port]||{}; }
    var flowNodes=NODES.map(function(n){
      var c=n.config||{}, xm=XN[n.id]||{}, xp=xm.ports||{};
      var base={ seq:seq[n.id], id:n.id, type:n.type, label:n.label||'',
                 does: xm.does || _defaultDoes(n) };
      if(xm.note) base.note=xm.note;
      var XL=xm.loops||{};
      function TO(port,node,toPort){ var e={node:node,port:toPort}; if(XL[port+'>>>'+node]) e.loop=XL[port+'>>>'+node]; return e; }
      var ins=[], outs=[];
      if(n.type==='input'){
        (c.outputs||[]).forEach(function(o){
          var m=xp[o.id]||{};
          ins=ins; outs.push({ port:o.id, type:m.type||o.type||'text',
            carries:m.carries||o.label||'', to:(OUT[n.id]||[]).filter(function(e){return e.port===o.id;})
              .map(function(e){ return TO(o.id, e.node, e.toPort); }) });
        });
      } else if(n.type==='note'){
        (OUT[n.id]||[]).forEach(function(e){
          var m=xp['text']||{};
          outs.push({ port:'text', type:'text', carries:m.carries||'注释正文',
                      inject:m.inject||'system', to:[TO('text', e.node, e.toPort)] });
        });
      } else if(n.type==='model_call'){
        (c.inputs||[]).forEach(function(o){
          var m=xp[o.id]||{};
          var pin={ port:o.id, type:m.type||o.type||'any', carries:m.carries||o.label||'',
                    required:(m.required===undefined?true:m.required),
                    from:(IN[n.id]||{})[o.id]||[] };
          if(m.mode) pin.mode=m.mode;
          if(m.inject) pin.inject=m.inject;
          ins.push(pin);
        });
        (c.outputs||[]).forEach(function(o){
          var m=xp[o.id]||{};
          outs.push({ port:o.id, type:m.type||o.type||'text', carries:m.carries||o.label||'',
            to:(OUT[n.id]||[]).filter(function(e){return e.port===o.id;})
              .map(function(e){ return TO(o.id, e.node, e.toPort); }) });
        });
      } else if(n.type==='output'){ /* output */
        (c.inputs||[]).forEach(function(o){
          var m=xp[o.id]||{};
          var pin2={ port:o.id, type:m.type||o.type||'any', carries:m.carries||o.label||'',
                     required:(m.required===undefined?true:m.required),
                     from:(IN[n.id]||{})[o.id]||[] };
          if(m.mode) pin2.mode=m.mode;
          ins.push(pin2);
        });
      }
      /* 端口去重：同一端口名只保留一条（防止上游重复推入） */
      var _si={}, _so={};
      ins=ins.filter(function(p){ if(_si[p.port]) return false; _si[p.port]=1; return true; });
      outs=outs.filter(function(p){ if(_so[p.port]) return false; _so[p.port]=1; return true; });
      base.inputs=ins; base.outputs=outs;
      if(n.type==='note'){
        base.text=xm.text||'';
        var at=(c.attached_to||[]).map(function(id){ return { node:id }; });
        if(at.length) base.attached_to=at;
      } else if(n.type==='task'){
        (c.inputs||[]).forEach(function(o){
          var m=xp[o.id]||{};
          var tp={ port:o.id, type:m.type||o.type||'any', carries:m.carries||o.label||'',
                   required:(m.required===undefined?true:m.required), from:(IN[n.id]||{})[o.id]||[] };
          if(m.mode) tp.mode=m.mode;
          if(m.inject) tp.inject=m.inject;
          ins.push(tp);
        });
        (c.outputs||[]).forEach(function(o){
          var m=xp[o.id]||{};
          outs.push({ port:o.id, type:m.type||o.type||'text', carries:m.carries||o.label||'',
            to:(OUT[n.id]||[]).filter(function(e){return e.port===o.id;})
              .map(function(e){ return TO(o.id, e.node, e.toPort); }) });
        });
        base.config={ command:c.command||'', deterministic:(c.deterministic!==false), timeout_sec:c.timeout_sec||0 };
      } else if(n.type==='model_call'){
        var pid=c.provider&&c.provider.id, bu=c.provider&&c.provider.base_url;
        base.config={ provider:{ id:PROVIDER_REV[bu]||pid||'deepseek', model:c.model||'' },
                      structured:(c.structured&&c.structured.mode) ? { mode:c.structured.mode, tool_name:c.structured.tool_name||'', tool_description:c.structured.tool_description||'', schema:(c.structured.schema||null), strict:!!c.structured.strict } : undefined,
                      prompt:{ template:(c.prompt&&c.prompt.template)||'',
                               variables:(c.prompt&&c.prompt.variables)||[],
                               system:(c.prompt&&c.prompt.system)||'' },
                      params:{} };
      }
      return base;
    });
    var ident=Object.assign({ id:p.meta&&p.meta.pipeline_id||'pipeline',
      name:p.meta&&p.meta.name||'未命名管线', version:p.meta&&p.meta.version||'1.0.0',
      author:'', license:'MIT', created:'', based_on:null }, X.identity||{});
    var flow={ format:'flowscore.pipeline', format_version:X.format_version||'2.1.0',
      identity:ident, about:Object.assign({ summary:'', requires:[], produces:[] }, X.about||{}) };
    if(X.globals) flow.globals=X.globals;
    flow.runtime=X.runtime||{ concurrency:(p.runtime&&p.runtime.concurrency)||1,
                              continue_on_error:!!(p.runtime&&p.runtime.continue_on_error), timeout_sec:0 };
    flow.nodes=flowNodes;
    /* 挂靠双向一致：把注释 id 回填到目标节点的 annotations */
    flowNodes.forEach(function(n){
      if(n.type!=='note') return;
      (n.attached_to||[]).forEach(function(a){
        var t=null;
        flowNodes.forEach(function(m){ if(m.id===a.node) t=m; });
        if(t){ if(!t.annotations) t.annotations=[]; if(t.annotations.indexOf(n.id)<0) t.annotations.push(n.id); }
      });
    });
    return flow;
  }
  function _defaultDoes(n){
    var c=n.config||{};
    if(n.type==='input') return '管线入口：提供静态文本内容';
    if(n.type==='model_call') return '调用 '+(c.provider&&c.provider.id||'模型')+' / '+(c.model||'')+' 处理上游输入';
    if(n.type==='output') return '把上游结果写入文件（'+(c.format||'md')+'）';
    if(n.type==='note') return '注释：不参与执行';
    if(n.type==='task') return '确定性步骤：'+((c.command)||'脚本');
    return '';
  }
  function exportFlow(){
    var docs=XTR.graph.getDocs();
    var flow;
    try{ flow=v1ToFlow(docs); }
    catch(e){ XTR.ui.toast('转换为流谱格式失败：'+(e.message||e),'danger'); return; }
    download(JSON.stringify(flow,null,2), safeFilename(_baseName(docs.pipeline)+'.flow.json'), 'application/json;charset=utf-8');
    XTR.ui.toast('已导出流谱格式（'+flow.nodes.length+' 节点）','success');
  }

  function readAll(files){
    return Promise.all(Array.prototype.map.call(files,function(f){
      return new Promise(function(res,rej){
        var r=new FileReader();
        r.onload=function(){ res(String(r.result)); };
        r.onerror=function(){ rej(new Error('读取文件失败：'+f.name)); };
        r.readAsText(f,'utf-8');
      });
    }));
  }
  function _isFlowDoc(o){
    return !!(o && typeof o==='object' && o.format==='flowscore.pipeline' && Array.isArray(o.nodes));
  }
  /* 流谱格式（节点中心）→ 生成器内部 v1（边表） */
  function flowToV1(flow){
    var p=XTR.model.newPipeline();
    var I=flow.identity||{}, A=flow.about||{};
    p.meta.name=I.name||I.id||'未命名管线';
    p.meta.pipeline_id=I.id||p.meta.pipeline_id;
    if(I.version) p.meta.version=String(I.version);
    function PORT(o,def){ return {id:o.port, type:o.type||def, label:o.carries||o.port}; }
    p.nodes=(flow.nodes||[]).map(function(n){
      var cfg;
      if(n.type==='note'){
        cfg={ text:n.text||'', attached_to:(n.attached_to||[]).map(function(a){ return a.node; }) };
      } else if(n.type==='input'){
        cfg={ content:(n.config&&n.config.content)||'', outputs:(n.outputs||[]).map(function(o){ return PORT(o,'text'); }) };
      } else if(n.type==='model_call'){
        var pr=(n.config&&n.config.provider)||{}, pm=(n.config&&n.config.prompt)||{};
        cfg={
          provider:(function(){
            var KNOWN={
              deepseek:{b:'https://api.deepseek.com/v1',e:'DEEPSEEK_API_KEY',l:'DeepSeek'},
              glm:{b:'https://open.bigmodel.cn/api/paas/v4',e:'GLM_API_KEY',l:'GLM'},
              zhipu:{b:'https://open.bigmodel.cn/api/paas/v4',e:'GLM_API_KEY',l:'GLM'},
              kimi:{b:'https://api.moonshot.cn/v1',e:'KIMI_API_KEY',l:'Kimi'},
              moonshot:{b:'https://api.moonshot.cn/v1',e:'KIMI_API_KEY',l:'Kimi'},
              qwen:{b:'https://dashscope.aliyuncs.com/compatible-mode/v1',e:'QWEN_API_KEY',l:'Qwen'},
              dashscope:{b:'https://dashscope.aliyuncs.com/compatible-mode/v1',e:'QWEN_API_KEY',l:'Qwen'}
            };
            var pid=pr.id||'deepseek', k=KNOWN[pid]||{b:'https://api.deepseek.com/v1',e:'API_KEY',l:pid};
            return { id:pid, label:pr.label||k.l||pid, channel:pr.channel||'builtin',
                     base_url:pr.base_url||k.b, api_key_env:pr.api_key_env||k.e };
          })(),
          model:pr.model||'',
          structured:(n.config&&n.config.structured&&n.config.structured.mode)?n.config.structured:undefined,
          prompt:{ template:pm.template||'', variables:pm.variables||[], system:pm.system||'' },
          output:{ format:'md', filename_template:'result.md', encoding:'utf-8', overwrite:'overwrite' },
          inputs:(n.inputs||[]).map(function(i){ return PORT(i,'any'); }),
          outputs:(n.outputs||[]).map(function(o){ return PORT(o,'text'); })
        };
      } else if(n.type==='task'){
        var tc=n.config||{};
        cfg={ command:tc.command||'', deterministic:(tc.deterministic!==false), timeout_sec:tc.timeout_sec||0,
              inputs:(n.inputs||[]).map(function(i){ return PORT(i,'any'); }),
              outputs:(n.outputs||[]).map(function(o){ return PORT(o,'text'); }) };
      } else {
        cfg={ format:'md', filename_template:'result.md', encoding:'utf-8', overwrite:'overwrite',
              inputs:(n.inputs||[]).map(function(i){ return PORT(i,'any'); }) };
      }
      return { id:n.id, type:n.type, label:n.label||'', config:cfg };
    });
    p.edges=[];
    (flow.nodes||[]).forEach(function(n){
      (n.outputs||[]).forEach(function(o){
        (o.to||[]).forEach(function(t){
          p.edges.push({ from:n.id, from_port:o.port, to:t.node, to_port:t.port });
        });
      });
    });
    /* 扩展袋：把流谱独有字段存下来，导出时才能无损还原 */
    var x={ flow:{ format_version:flow.format_version||'',
                   identity:flow.identity||{}, about:flow.about||{}, globals:flow.globals||null,
                   runtime:flow.runtime||null }, nodes:{} };
    (flow.nodes||[]).forEach(function(n){
      var ports={};
      (n.inputs||[]).forEach(function(o){
        ports[o.port]={ dir:'in', type:o.type||'', carries:o.carries||'',
                        required:(o.required===false?false:true), mode:o.mode||'', inject:o.inject||'' };
      });
      (n.outputs||[]).forEach(function(o){
        ports[o.port]={ dir:'out', type:o.type||'', carries:o.carries||'', inject:o.inject||'' };
      });
      var loops={};
      (n.outputs||[]).forEach(function(o){
        (o.to||[]).forEach(function(t){ if(t.loop) loops[o.port+'>>>'+t.node]=t.loop; });
      });
      x.nodes[n.id]={ does:n.does||'', note:n.note||'',
                      seq:(typeof n.seq==='number'?n.seq:null),
                      ports:ports, loops:loops,
                      tcfg:(n.type==='task'?(n.config||{}):null),
                      text:(n.type==='note'?(n.text||''):'') };
    });
    p.x=x;
    return p;
  }
  function detectKind(text){
    var obj;
    try{ obj=JSON.parse(text); }
    catch(e){ throw new Error('文件不是合法的 JSON：'+e.message); }
    if(!obj||typeof obj!=='object') throw new Error('文件内容不是 JSON 对象');
    if(_isFlowDoc(obj)) return {obj:flowToV1(obj), kind:'pipeline', from:'flowscore.pipeline'};
    if(!obj.kind) throw new Error('文件缺少 kind 字段，也无法识别为流谱格式（应为 kind="pipeline"/"layout"，或 format="flowscore.pipeline"）');
    return {obj:obj,kind:String(obj.kind)};
  }
  function _isNewer(ver){
    if(!ver) return false;
    var a=String(ver).split('.'),b=SCHEMA_VERSION.split('.');
    for(var i=0;i<3;i++){
      var x=parseInt(a[i],10)||0,y=parseInt(b[i],10)||0;
      if(x>y) return true;
      if(x<y) return false;
    }
    return false;
  }
  function _migrationPrompt(ver,c){
    return [
      '你是一名配置迁移助手。请帮我把一条可视化管线配置从旧版 Schema 迁移到新版。',
      '',
      '目标 Schema 版本：'+SCHEMA_VERSION,
      '源文件 Schema 版本：'+(ver||'未知'),
      '',
      '迁移要求：',
      '1. 为新增字段补齐默认值；',
      '2. 将已废弃字段映射到新字段（如字段改名，请给出对应关系）；',
      '3. 保持 nodes / edges 的 id 与连接关系不变；',
      '4. 保留未识别的字段到 _unknown 列表并说明；',
      '5. 输出迁移后的完整 JSON（kind="pipeline"），并附变更说明。',
      '',
      '兼容性提示：'+((c&&c.message)||'版本不一致，需要人工核对。')
    ].join('\n');
  }
  function _handleCompat(ver,onDone){
    var c=null;
    try{ c=XTR.validate.checkCompatibility(ver); }catch(e){}
    if(!c||c.level==='ok'){ onDone(true); return; }
    var body=document.createElement('div');
    var p=document.createElement('p');
    p.className='compat-msg';
    p.textContent=(c&&c.message)||('文件 Schema 版本为 '+(ver||'未知')+'，与当前应用不完全兼容。');
    body.appendChild(p);
    var btns=[];
    btns.push({
      label:'复制迁移提示词',type:'ghost',
      onClick:function(){
        XTR.ui.copyText(_migrationPrompt(ver,c));
        return true; /* 保持弹窗打开 */
      }
    });
    if(c.level==='warn'||c.level==='info'){
      btns.push({label:'继续导入',type:'primary',onClick:function(){ onDone(true); }});
    }
    btns.push({label:'取消',onClick:function(){ onDone(false); }});
    XTR.ui.modal({title:'版本兼容性提示',body:body,buttons:btns,dismissable:false});
  }
  function _finishImport(pipeline,layout,isNewerFile){
    if(layout){
      var pidA=(layout.meta&&layout.meta.pipeline_id)||'';
      var pidB=(pipeline.meta&&pipeline.meta.pipeline_id)||'';
      if(pidA&&pidB&&pidA!==pidB){
        XTR.ui.toast('两份文件不属于同一条管线','danger');
        return;
      }
      if(pidA&&!pidB){ if(!pipeline.meta) pipeline.meta={}; pipeline.meta.pipeline_id=pidA; }
      if(pidB&&!pidA){ if(!layout.meta) layout.meta={}; layout.meta.pipeline_id=pidB; }
    }
    var warnings=[];
    try{
      var _rn=XTR.model.normalize(pipeline,{preserveUnknown:!!isNewerFile});
      if(_rn&&_rn.doc) pipeline=_rn.doc;
      warnings=(_rn&&_rn.warnings)||[];
    }catch(e){}
    var _hadLayout=!!layout;
    if(!layout){
      layout=XTR.model.newLayout();
      if(layout.meta) layout.meta.pipeline_id=(pipeline.meta&&pipeline.meta.pipeline_id)||'';
      XTR.graph.setDocs(pipeline,layout);
      try{ XTR.graph.autoLayout(); }catch(e){}
      XTR.ui.toast('已自动生成布局','info');
    }else{
      try{
        var _rl2=XTR.model.normalize(layout,{preserveUnknown:!!isNewerFile});
        if(_rl2&&_rl2.doc) layout=_rl2.doc;
      }catch(e){}
    }
    XTR.graph.setDocs(pipeline,layout);
    XTR.view.setSelection([]);
    XTR.bus.emit('selection:changed',[]);
    XTR.bus.emit('io:imported',{pipeline:pipeline,layout:layout});
    if(_hadLayout&&layout.viewport){ XTR.view.setTransform({x:+layout.viewport.x||0,y:+layout.viewport.y||0,k:+layout.viewport.zoom||1}); }
    XTR.ui.toast('导入成功：'+((pipeline.meta&&pipeline.meta.name)||'未命名管线'),'success');
    if(warnings.length){
      XTR.ui.toast('导入完成，存在 '+warnings.length+' 条结构提醒（未知字段已保留）','info');
    }
  }
  function _importTexts(texts){
    var pipeline=null,layout=null;
    for(var i=0;i<texts.length;i++){
      var d=detectKind(texts[i]);
      if(d.kind==='pipeline'){
        if(pipeline) throw new Error('选择了多份管线文件，请只保留一份');
        pipeline=d.obj;
      }else if(d.kind==='layout'){
        if(layout) throw new Error('选择了多份布局文件，请只保留一份');
        layout=d.obj;
      }else{
        throw new Error('未知的 kind 字段值：'+d.kind+'（应为 "pipeline" 或 "layout"）');
      }
    }
    if(!pipeline) throw new Error('未找到管线文件（kind="pipeline"），布局文件需与管线文件一起导入');
    var errs=_schemaErrors('pipeline',pipeline);
    if(layout) errs=errs.concat(_schemaErrors('layout',layout));
    if(errs.length){
      XTR.ui.modal({
        title:'导入失败',
        body:_errListBody(errs,'Schema 校验发现 {n} 个问题，画布内容未被修改：'),
        buttons:[{label:'返回',type:'primary'}]
      });
      return;
    }
    var ver=(pipeline.schema_version||(pipeline.meta&&pipeline.meta.schema_version))||'';
    _handleCompat(ver,function(proceed){
      if(!proceed) return;
      _finishImport(pipeline,layout,_isNewer(ver));
    });
  }
  function importFiles(files){
    readAll(files).then(function(texts){
      try{ _importTexts(texts); }
      catch(e){ XTR.ui.toast(e.message||'导入失败','danger'); }
    },function(e){
      XTR.ui.toast((e&&e.message)||'读取文件失败','danger');
    });
  }
  window.XTR.io={
    download:download,
    safeFilename:safeFilename,
    exportPipeline:exportPipeline,
    exportLayout:exportLayout,
    exportBoth:exportBoth,
    exportFlow:exportFlow,
    pickFiles:pickFiles,
    readAll:readAll,
    detectKind:detectKind,
    importText:_importTexts,
    importFrom:importFiles,
    importFiles:importFiles
  };
})();

/* ================= 分区 12：自动保存 ================= */
(function(){
  var KEY='xtr.autosave.v1';
  var APP_VERSION='0.1.0';
  var SCHEMA_VERSION='1.0.0';
  var timer=null;
  function schedule(){
    if(timer) clearTimeout(timer);
    timer=setTimeout(function(){
      timer=null;
      saveNow();
    },1000);
  }
  function _payload(){
    var docs=XTR.graph.getDocs();
    if(!docs||!docs.pipeline) return null;
    var _tr=null;
    try{ _tr=XTR.view.getTransform(); }catch(e){}
    if(_tr&&docs&&docs.layout){
      if(!docs.layout.viewport) docs.layout.viewport={x:0,y:0,zoom:1};
      docs.layout.viewport.x=Math.round(_tr.x*100)/100;
      docs.layout.viewport.y=Math.round(_tr.y*100)/100;
      docs.layout.viewport.zoom=Math.round(_tr.k*1000)/1000;
    }
    return {
      savedAt:new Date().toISOString(),
      appVersion:APP_VERSION,
      schemaVersion:SCHEMA_VERSION,
      pipeline:docs.pipeline,
      layout:docs.layout
    };
  }
  function saveNow(){
    var _p=_payload();
    if(!_p) return;
    try{
      localStorage.setItem(KEY,JSON.stringify(_p));
    }catch(e){
      var name=(e&&e.name)||'';
      var msg=(e&&e.message)||'';
      if(name==='QuotaExceededError'||/quota/i.test(name+' '+msg)){
        XTR.ui.toast('自动保存失败：内容过大，请手动导出','danger');
      }
      /* 不阻塞编辑 */
    }
  }
  function load(){
    try{
      var raw=localStorage.getItem(KEY);
      if(!raw) return null;
      var obj=JSON.parse(raw);
      if(!obj||!obj.pipeline||typeof obj.pipeline!=='object') return null;
      return obj;
    }catch(e){ return null; }
  }
  function hasSession(){ return !!load(); }
  function clear(){
    try{ localStorage.removeItem(KEY); }catch(e){}
  }
  window.XTR.store={
    schedule:schedule,
    saveNow:saveNow,
    load:load,
    hasSession:hasSession,
    clear:clear
  };
})();

/* ================= 分区 14：应用装配与启动 ================= */
(function(){
  var _validateTimer=null;
  function boot(){
    XTR.view.mount(document.getElementById('canvas-wrap'));
    XTR.interact.init();
    XTR.inspector.mount(document.getElementById('inspector'));
    XTR.ui.mount();
    _bindBus();
    window.addEventListener('beforeunload',function(){
      try{ XTR.store.saveNow(); }catch(e){}
    });
    _startup();
  }
  function _bindBus(){
    XTR.bus.on('doc:changed',function(){
      XTR.view.renderAll();
      XTR.inspector.refresh();
      XTR.store.schedule();
      XTR.ui.updateStatusBar();
      if(_validateTimer) clearTimeout(_validateTimer);
      _validateTimer=setTimeout(function(){
        _validateTimer=null;
        XTR.ui.updateStatusBar();
      },300);
    });
    XTR.bus.on('selection:changed',function(sel){
      var ids=(sel&&sel.nodes)||[];
      if(ids.length===1) XTR.inspector.show(ids[0]);
      else XTR.inspector.hide();
      XTR.ui.updateStatusBar();
    });
    XTR.bus.on('view:transform',function(){
      XTR.ui.updateStatusBar();
    });
    XTR.bus.on('io:imported',function(){
      XTR.view.fitToContent();
    });
  }
  function _startup(){
    var _open=null;
    try{ _open=new URLSearchParams(location.search).get('open'); }catch(e){}
    if(_open){
      var _u=_open;
      if(_u.charAt(0)!=='/' && _u.indexOf('http')!==0) _u='/'+_u;
      fetch(_u,{cache:'no-store'}).then(function(r){
        if(!r.ok) throw new Error('HTTP '+r.status+' · '+_u);
        return r.text();
      }).then(function(t){
        try{ XTR.io.importText([t]); }
        catch(e){ XTR.ui.toast('从链接载入失败：'+(e.message||e),'danger'); _loadSample(); }
      }).catch(function(e){
        XTR.ui.toast('从链接载入失败：'+(e.message||e),'danger');
        _loadSample();
      });
      return;
    }
    if(XTR.store.hasSession()){
      var s=XTR.store.load();
      var when='';
      try{ when=s.savedAt?new Date(s.savedAt).toLocaleString():'未知时间'; }catch(e){ when='未知时间'; }
      var nm=(s.pipeline&&s.pipeline.meta&&s.pipeline.meta.name)||'未命名管线';
      XTR.ui.confirm({
        title:'恢复上次会话？',
        message:'检测到 '+when+' 自动保存的会话：「'+nm+'」。是否恢复？',
        okLabel:'恢复会话',
        cancelLabel:'丢弃并载入示例',
        dismissable:false
      }).then(function(ok){
        if(ok&&s.pipeline){
          try{
            var _rp=XTR.model.normalize(s.pipeline,{});
            if(_rp&&_rp.doc) s.pipeline=_rp.doc;
            var _rl=XTR.model.normalize(s.layout||XTR.model.newLayout(),{});
            if(_rl&&_rl.doc) s.layout=_rl.doc;
          }catch(err0){}
          XTR.graph.setDocs(s.pipeline,s.layout||XTR.model.newLayout());
          XTR.view.fitToContent();
          XTR.ui.toast('已恢复上次会话','success');
        }else{
          XTR.store.clear();
          _loadSample();
        }
      });
    }else{
      _loadSample();
    }
  }
  function _loadSample(){
    var p=XTR.model.newPipeline();
    p.meta.name='示例管线';
    p.nodes=[
      {id:'n_in',type:'input',label:'输入文本',config:{content:'会议原始记录：……（此处粘贴待整理内容）',outputs:[{id:'text',type:'text',label:'文本'}]}},
      {id:'n_model',type:'model_call',label:'',config:{
        provider:{id:'deepseek',label:'DeepSeek',channel:'builtin',base_url:'https://api.deepseek.com/v1',api_key_env:'DEEPSEEK_API_KEY'},
        model:'deepseek-chat',
        prompt:{template:'请把下面的文本整理为结构清晰的 Markdown 纪要：\n{{ input.text }}',variables:[],system:''},
        output:{format:'md',filename_template:'meeting-notes.md',encoding:'utf-8',overwrite:'overwrite'},
        inputs:[{id:'in',type:'any',label:'输入'}],
        outputs:[{id:'out',type:'text',label:'输出'}]
      }},
      {id:'n_out',type:'output',label:'保存结果',config:{format:'md',filename_template:'meeting-notes.md',encoding:'utf-8',overwrite:'overwrite',inputs:[{id:'in',type:'any',label:'内容'}]}}
    ];
    p.edges=[
      {from:'n_in',from_port:'text',to:'n_model',to_port:'in'},
      {from:'n_model',from_port:'out',to:'n_out',to_port:'in'}
    ];
    var l=XTR.model.newLayout();
    if(l.meta) l.meta.pipeline_id=(p.meta&&p.meta.pipeline_id)||'';
    l.nodes={
      'n_in':{x:80,y:200},
      'n_model':{x:400,y:200},
      'n_out':{x:720,y:200}
    };
    XTR.graph.setDocs(p,l);
    XTR.view.resetViewport();
    XTR.view.fitToContent();
    XTR.inspector.hide();
    XTR.ui.updateStatusBar();
    XTR.ui.toast('已载入内置示例：输入 → 模型调用（DeepSeek）→ 输出（.md）','info');
  }
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',boot);
  }else{
    boot();
  }
  window.XTR.app={boot:boot};
})();
</script>
</body>
