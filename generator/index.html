<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管线编排器 XTR</title>
<style>
/* ============ A1 设计变量 ============ */
:root{
  --bg:#0f1115;
  --panel:#171a21;
  --panel-2:#1d212b;
  --panel-3:#242a38;
  --border:#2a2f3c;
  --text:#e6e9f0;
  --muted:#8b93a7;
  --primary:#4f8cff;
  --primary-d:#3a6fd8;
  --success:#3ecf8e;
  --warn:#f0b429;
  --danger:#ff5d5d;
  --sel:#4f8cff;
  --grid:#1f2430;
  --radius:8px;
  --radius-s:6px;
  --gap:8px;
  --gap-s:4px;
  --fs:13px;
  --fs-s:12px;
  --fs-l:14px;
  --font:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{font-family:var(--font);font-size:var(--fs);color:var(--text);background:var(--bg);overflow:hidden}
button{font-family:inherit}

/* ============ A2 布局 ============ */
#app{display:flex;flex-direction:column;height:100vh}
#toolbar{display:flex;align-items:center;gap:var(--gap);padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--border);flex:none;flex-wrap:wrap}
.tb-group{display:flex;align-items:center;gap:var(--gap-s)}
.tb-grow{flex:1;min-width:160px}
#pipeline-name{flex:1;min-width:120px}
#main{flex:1;display:flex;min-height:0}
#palette{width:220px;flex:none;background:var(--panel);border-right:1px solid var(--border);overflow-y:auto;padding:10px}
#canvas-wrap{flex:1;position:relative;overflow:hidden;background:var(--bg);min-width:0}
#inspector{width:320px;flex:none;background:var(--panel);border-left:1px solid var(--border);overflow-y:auto;padding:10px}
#statusbar{flex:none;display:flex;align-items:center;gap:14px;padding:4px 12px;background:var(--panel);border-top:1px solid var(--border);font-size:var(--fs-s);color:var(--muted)}
@media (max-width:1200px){ #palette{width:190px} #inspector{width:290px} }
@media (max-width:1000px){ #palette{width:168px} #inspector{width:256px} }
@media (max-width:860px){ #palette{width:150px;padding:8px} #inspector{width:226px;padding:8px} #toolbar{padding:6px 8px} #statusbar{gap:8px;flex-wrap:wrap} }

/* ============ 通用控件 ============ */
.tb-btn{background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-s);padding:5px 10px;font-size:var(--fs-s);cursor:pointer;white-space:nowrap}
.tb-btn:hover:not(:disabled){background:var(--panel-3);border-color:var(--primary)}
.tb-btn:disabled{opacity:.45;cursor:not-allowed}
.tb-btn.active{border-color:var(--primary);color:var(--primary)}
.tb-btn.danger:hover:not(:disabled){border-color:var(--danger);color:var(--danger)}
input[type=text],textarea,select{background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-s);padding:5px 8px;font-size:var(--fs-s);font-family:inherit;width:100%}
input[type=text]:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary)}
input[readonly]{opacity:.75;cursor:not-allowed}

/* ============ A3 画布 ============ */
#canvas{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#canvas-wrap.panning{cursor:grabbing}
#layer-grid{pointer-events:none}
.node{cursor:default}
.node-body{fill:var(--panel-2);stroke:var(--border);stroke-width:1}
.node.selected .node-body{stroke:var(--sel);stroke-width:2}
.node-header,.node-header-sq{fill:var(--panel-3)}
.node-header,.node-header-sq{cursor:move}
.node-title{fill:var(--text);font-size:var(--fs);font-weight:600;pointer-events:none}
.node-sub{fill:var(--muted);font-size:11px;pointer-events:none}
.node-type{fill:var(--muted);font-size:10px;pointer-events:none;opacity:.85}
.port{stroke:var(--bg);stroke-width:2;cursor:crosshair}
.port.in{fill:var(--primary)}
.port.out{fill:var(--success)}
.port:hover{r:8}
.port-label{fill:var(--muted);font-size:10px;pointer-events:none}
g.edge{cursor:pointer}
.edge-hit{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke}
.edge-line{fill:none;stroke:var(--muted);stroke-width:2;marker-end:url(#arrow);pointer-events:none}
g.edge.selected .edge-line{stroke:var(--sel);stroke-width:2.5}
#arrow path{fill:var(--muted)}
g.edge.selected #arrow path{fill:var(--sel)}
.temp-link{fill:none;stroke:var(--primary);stroke-width:2;stroke-dasharray:6 4;pointer-events:none}
.temp-link.invalid{stroke:var(--danger)}
.sel-box{fill:rgba(79,140,255,.12);stroke:var(--primary);stroke-dasharray:4 3;stroke-width:1;pointer-events:none}

/* ============ A4 面板 ============ */
.pal-title{font-size:var(--fs-s);color:var(--muted);margin:2px 2px 8px;letter-spacing:1px}
.pal-card{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius);padding:8px;margin-bottom:8px;cursor:grab}
.pal-card:hover{border-color:var(--primary)}
.pal-icon{width:30px;height:30px;flex:none;border-radius:var(--radius-s);display:flex;align-items:center;justify-content:center;font-size:var(--fs-l);font-weight:700}
.pal-icon.in{background:rgba(62,207,142,.15);color:var(--success)}
.pal-icon.mc{background:rgba(79,140,255,.15);color:var(--primary)}
.pal-icon.out{background:rgba(240,180,41,.15);color:var(--warn)}
.pal-icon.nt{background:rgba(167,139,250,.15);color:#a78bfa}
.pal-icon.tk{background:rgba(202,138,4,.15);color:#ca8a04}
.pal-info{flex:1;min-width:0}
.pal-name{font-size:var(--fs);font-weight:600}
.pal-desc{font-size:var(--fs-s);color:var(--muted);margin-top:2px}
.pal-add{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--border);background:var(--panel-3);color:var(--text);font-size:15px;line-height:1;cursor:pointer}
.pal-add:hover{background:var(--primary);border-color:var(--primary)}

.insp-empty{padding:32px 12px;text-align:center;color:var(--muted)}
.insp-empty-title{font-size:var(--fs-l);color:var(--text);margin-bottom:8px}
.insp-empty-desc{font-size:var(--fs-s);line-height:1.7}
.insp-head{padding:6px 8px;margin-bottom:8px;background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius)}
.insp-type{font-weight:700;font-size:var(--fs-l)}
.insp-id{color:var(--muted);font-size:var(--fs-s);font-family:var(--mono);margin-top:2px}
.field{margin-bottom:12px;padding:0 2px}
.field-label{display:flex;align-items:center;font-size:var(--fs-s);color:var(--text);margin-bottom:5px}
.req{color:var(--danger);margin-left:2px}
.tip{position:relative;display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;background:var(--border);color:var(--muted);font-size:10px;cursor:help;margin-left:5px;flex:none}
.tip:hover{background:var(--primary);color:#fff}
.tip::after{content:none}
.tip:hover::after{opacity:1}
#inspector .tip::after{left:auto;right:0;transform:none}
.tip-bubble{display:none;position:fixed;z-index:300;background:rgba(0,0,0,.95);color:var(--text);font-size:var(--fs-s);font-weight:400;line-height:1.5;padding:7px 10px;border-radius:6px;max-width:260px;white-space:normal;box-shadow:0 6px 18px rgba(0,0,0,.4);pointer-events:none}
.field-msg{font-size:var(--fs-s);min-height:14px;margin-top:4px;line-height:1.4}
.field-msg.err{color:var(--danger)}
.field-msg.warn{color:var(--warn)}
.prompt-wrap{position:relative;background:var(--panel-2)}
.prompt-hl,.prompt-ta{margin:0;font-family:var(--mono);font-size:var(--fs-s);line-height:1.6;padding:7px 8px;border-radius:var(--radius-s);white-space:pre-wrap;word-break:break-all}
.prompt-hl{position:absolute;inset:0;overflow:hidden;pointer-events:none;border:1px solid transparent}
.prompt-ta{position:relative;display:block;width:100%;min-height:96px;background:transparent;border:1px solid var(--border);color:transparent;caret-color:var(--text);resize:vertical}
.prompt-ta:focus{outline:none;border-color:var(--primary)}
.prompt-hl code{font:inherit}
mark{background:rgba(79,140,255,.35);color:inherit;border-radius:2px;padding:0 1px}
mark.dangling{background:rgba(240,180,41,.4)}
.fmt-row{display:flex;gap:6px}
.fmt-row select{flex:1}
.fmt-row input{flex:1}

/* ============ A5 模态 / Toast / 状态栏 ============ */
#modal-root .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);width:480px;max-width:96vw;max-height:84vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.modal.wide{width:640px}
.modal-title{padding:12px 16px;font-size:var(--fs-l);font-weight:700;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px}
.modal-x{background:transparent;border:0;color:var(--text);opacity:.55;font-size:20px;line-height:1;cursor:pointer;padding:0 4px}
.modal-x:hover{opacity:1}
.modal-body{padding:14px 16px;overflow-y:auto;font-size:var(--fs);line-height:1.7}
.modal-msg{white-space:pre-line;color:var(--text)}
.modal-footer{padding:10px 16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.m-btn{border:1px solid var(--border);background:var(--panel-2);color:var(--text);border-radius:var(--radius-s);padding:6px 14px;font-size:var(--fs-s);cursor:pointer}
.m-btn:hover{border-color:var(--primary)}
.m-btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.m-btn.primary:hover{background:var(--primary-d)}
.m-btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.err-list{margin:0;padding-left:18px;color:var(--danger);font-size:var(--fs-s);line-height:1.8}
.warn-list{margin:0;padding-left:18px;color:var(--warn);font-size:var(--fs-s);line-height:1.8}
.modal textarea{font-family:var(--mono);min-height:110px;resize:vertical}
#toast-root{position:fixed;bottom:44px;right:16px;z-index:120;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--panel-3);border:1px solid var(--border);border-left:3px solid var(--primary);color:var(--text);border-radius:var(--radius-s);padding:8px 14px;font-size:var(--fs-s);max-width:340px;box-shadow:0 4px 16px rgba(0,0,0,.4);opacity:1;transition:opacity .3s,transform .3s}
.toast.success{border-left-color:var(--success)}
.toast.danger{border-left-color:var(--danger)}
.toast.info{border-left-color:var(--primary)}
.toast.out{opacity:0;transform:translateX(12px)}
.ctx-menu{position:fixed;z-index:1300;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:4px;min-width:150px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.ctx-item{display:block;width:100%;text-align:left;padding:7px 10px;background:none;border:none;color:var(--text);font-size:var(--fs-s);font-family:inherit;cursor:pointer;border-radius:6px;white-space:nowrap}
.ctx-item:hover:not(:disabled){background:var(--panel-3)}
.ctx-item.danger{color:var(--danger)}
.ctx-item:disabled{opacity:.45;cursor:default}
.ctx-sep{height:1px;background:var(--border);margin:4px 2px}
.st-ok{color:var(--success)}
.st-err{color:var(--danger)}
.st-warn{color:var(--warn)}
.help-table{width:100%;border-collapse:collapse;font-size:var(--fs-s)}
.help-table td{border-bottom:1px solid var(--border);padding:5px 6px;vertical-align:top}
.help-table td:first-child{white-space:nowrap;color:var(--primary);font-family:var(--mono)}
.help-sec{font-weight:700;margin:14px 0 6px;color:var(--text)}
.help-sec:first-child{margin-top:0}
/* ---- fix12: 通用按钮补齐（模态底栏按钮类名曾无对应样式）+ 连通测试框 ---- */
.btn{border:1px solid var(--border);background:var(--panel-2);color:var(--text);border-radius:var(--radius-s);padding:6px 14px;font-size:var(--fs-s);cursor:pointer;white-space:nowrap;font-family:inherit}
.btn:hover:not(:disabled){border-color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--primary-d)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn:disabled{opacity:.55;cursor:default}
.conn-test{border:1px dashed var(--border);border-radius:var(--radius);padding:10px;margin-bottom:12px;background:var(--panel-2)}
.conn-test .ct-head{font-weight:700;font-size:var(--fs-s);margin-bottom:7px;color:var(--text)}
.conn-test .ct-row{display:flex;gap:6px}
.conn-test input[type=password]{flex:1;min-width:0;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-s);padding:5px 8px;font-size:var(--fs-s);font-family:inherit}
.conn-test input[type=password]:focus{outline:none;border-color:var(--primary)}
.conn-test .ct-msg{font-size:var(--fs-s);color:var(--muted);margin-top:7px;line-height:1.6;white-space:pre-wrap}
.conn-test .ct-msg.err{color:var(--danger)}
.conn-test .ct-msg.ok{color:var(--success)}
.model-list{max-height:320px;overflow:auto;border:1px solid var(--border);border-radius:var(--radius-s);margin-top:8px}
.model-list .ml-item{padding:6px 10px;border-bottom:1px solid var(--border);cursor:pointer;font-family:var(--mono);font-size:var(--fs-s);color:var(--text)}
.model-list .ml-item:last-child{border-bottom:none}
.model-list .ml-item:hover{background:var(--panel-3)}
.ml-info{margin:0 0 8px;font-size:var(--fs-s);color:var(--muted);line-height:1.6;word-break:break-all}

/* ---------- 结构化输出：JSON Schema 编辑器 ---------- */
.schema-box { display: flex; flex-direction: column; gap: 6px; }
.schema-ta { width: 100%; font-family: var(--mono); font-size: 12px; line-height: 1.5; tab-size: 2; resize: vertical; }
.schema-bar { display: flex; flex-wrap: wrap; gap: 6px; }
.schema-btn { font-size: 12px; padding: 4px 10px; border: 1px solid var(--line, #3a3f47); background: transparent; color: inherit; border-radius: 3px; cursor: pointer; }
.schema-btn:hover { border-color: var(--accent, #4b9cd3); }
.schema-out { font-size: 12px; line-height: 1.6; padding: 6px 8px; border-radius: 3px; background: rgba(127,127,127,.08); color: inherit; word-break: break-word; white-space: normal; }
.schema-out.ok { color: #3fb950; background: rgba(63,185,80,.1); }
.schema-out.warn { color: #d29922; background: rgba(210,153,34,.1); }
.schema-out.err { color: #f85149; background: rgba(248,81,73,.1); }
.schema-test { display: flex; flex-direction: column; gap: 6px; padding-top: 4px; border-top: 1px dashed rgba(127,127,127,.3); }
</style>
</head>
<body>
<div id="app">
  <!-- B1 工具栏 -->
  <div id="toolbar">
    <div class="tb-group">
      <button id="btn-new" class="tb-btn" title="新建空白管线">新建</button>
      <button id="btn-import" class="tb-btn" title="导入管线 / 布局 JSON 文件">导入</button>
      <button id="btn-export-pipeline" class="tb-btn" title="导出管线配置文件">导出管线</button>
      <button id="btn-export-layout" class="tb-btn" title="导出画布布局文件">导出布局</button>
      <button id="btn-export-both" class="tb-btn" title="同时导出管线与布局两个文件">导出双文件</button>
      <button id="btn-export-flow" class="tb-btn" title="导出流谱格式（flowscore.pipeline），供管线库收录">导出流谱</button>
    </div>
    <div class="tb-group">
      <button id="btn-undo" class="tb-btn" title="撤销（Ctrl+Z）">撤销</button>
      <button id="btn-redo" class="tb-btn" title="重做（Ctrl+Shift+Z）">重做</button>
      <button id="btn-delete" class="tb-btn danger" title="删除选中的节点与连线（Delete）">删除</button>
    </div>
    <div class="tb-group">
      <button id="btn-fit" class="tb-btn" title="缩放画布以显示全部节点">适应画布</button>
      <button id="btn-grid" class="tb-btn active" title="显示 / 隐藏背景网格">网格</button>
    </div>
    <div class="tb-group tb-grow">
      <input id="pipeline-name" type="text" placeholder="管线名称">
    </div>
    <div class="tb-group">
      <button id="btn-run" class="tb-btn" disabled>试运行</button>
      <button id="btn-help" class="tb-btn" title="查看帮助与快捷键">帮助</button>
    </div>
  </div>
  <div id="main">
    <!-- B2 节点面板 -->
    <div id="palette">
      <div class="pal-title">节 点 库</div>
      <div class="pal-card" draggable="true" data-type="input">
        <div class="pal-icon in">入</div>
        <div class="pal-info"><div class="pal-name">输入</div><div class="pal-desc">提供文本内容，供下游引用</div></div>
        <button class="pal-add" data-add="input" title="添加到画布中心">+</button>
      </div>
      <div class="pal-card" draggable="true" data-type="model_call">
        <div class="pal-icon mc">模</div>
        <div class="pal-info"><div class="pal-name">模型调用</div><div class="pal-desc">调用 LLM 渠道处理输入</div></div>
        <button class="pal-add" data-add="model_call" title="添加到画布中心">+</button>
      </div>
      <div class="pal-card" draggable="true" data-type="output">
        <div class="pal-icon out">出</div>
        <div class="pal-info"><div class="pal-name">输出</div><div class="pal-desc">将结果写入文件</div></div>
        <button class="pal-add" data-add="output" title="添加到画布中心">+</button>
      </div>
      <div class="pal-card" draggable="true" data-type="task">
        <div class="pal-icon tk">任</div>
        <div class="pal-info"><div class="pal-name">任务</div><div class="pal-desc">确定性步骤：门禁/构建器/脚本</div></div>
        <button class="pal-add" data-add="task" title="添加到画布中心">+</button>
      </div>
      <div class="pal-card" draggable="true" data-type="note">
        <div class="pal-icon nt">注</div>
        <div class="pal-info"><div class="pal-name">注释</div><div class="pal-desc">不执行；连输入=注入提示词，不连=只展示</div></div>
        <button class="pal-add" data-add="note" title="添加到画布中心">+</button>
      </div>
    </div>
    <!-- B3 画布 -->
    <div id="canvas-wrap">
      <svg id="canvas">
        <defs>
          <pattern id="grid-pattern" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 H 0 V 20" fill="none" stroke="var(--grid)" stroke-width="1"/>
          </pattern>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z"/>
          </marker>
        </defs>
        <g id="viewport">
          <g id="layer-grid"><rect id="grid-rect" x="-5000" y="-5000" width="15000" height="15000" fill="url(#grid-pattern)"/></g>
          <g id="layer-edges"></g>
          <g id="layer-nodes"></g>
          <g id="layer-overlay"></g>
        </g>
      </svg>
    </div>
    <!-- B4 属性面板 -->
    <div id="inspector">
      <div id="inspector-empty" class="insp-empty">
        <div class="insp-empty-title">未选中节点</div>
        <div class="insp-empty-desc">从左侧「节点库」点击 + 或拖拽卡片到画布创建节点；选中节点后可在此配置属性。选中「模型调用」节点可设置渠道、模型、提示词与输出格式。</div>
      </div>
      <div id="inspector-form" style="display:none"></div>
    </div>
  </div>
  <!-- B5 状态栏 -->
  <div id="statusbar">
    <span id="st-nodes">节点 0</span>
    <span id="st-edges">连线 0</span>
    <span id="st-zoom">缩放 100%</span>
    <span id="st-valid" class="st-warn">校验：待校验</span>
  </div>
</div>
<!-- B6 模态与 Toast 挂载点 -->
<div id="modal-root"></div>
<div id="toast-root"></div>
<input type="file" id="file-input" multiple accept=".json" hidden>

<script>
/* ================= 分区 0：常量与版本 ================= */
(function(){
  var APP_VERSION='0.1.0';
  var SCHEMA_VERSION='1.0.0';
  var SUPPORTED={major:1,label:'1.x',range:'1.0.0 – '+SCHEMA_VERSION};
  var STORAGE_KEY='xtr.autosave.v1';
  var EVENTS={
    DOC_CHANGED:'doc:changed',
    SELECTION_CHANGED:'selection:changed',
    TRANSFORM:'view:transform',
    IMPORTED:'io:imported'
  };
  var bus=(function(){
    var map={};
    return {
      on:function(ev,fn){ (map[ev]=map[ev]||[]).push(fn); var self=this; return function(){ self.off(ev,fn); }; },
      off:function(ev,fn){ if(map[ev]) map[ev]=map[ev].filter(function(f){return f!==fn;}); },
      emit:function(ev,data){ (map[ev]||[]).slice().forEach(function(fn){ try{ fn(data); }catch(e){ console.error(e); } }); }
    };
  })();
  window.XTR={
    APP_VERSION:APP_VERSION,
    SCHEMA_VERSION:SCHEMA_VERSION,
    SUPPORTED:SUPPORTED,
    STORAGE_KEY:STORAGE_KEY,
    EVENTS:EVENTS,
    bus:bus
  };
})();

/* ================= 分区 1：工具函数 ================= */
(function(){
  function clamp(v,min,max){ return Math.min(max,Math.max(min,v)); }
  function throttle(fn,wait){
    var last=0,timer=null;
    return function(){
      var self=this,args=arguments,now=Date.now();
      if(now-last>=wait){ last=now; fn.apply(self,args); }
      else if(!timer){ timer=setTimeout(function(){ last=Date.now(); timer=null; fn.apply(self,args); },wait-(now-last)); }
    };
  }
  function debounce(fn,wait){
    var timer=null;
    return function(){
      var self=this,args=arguments;
      clearTimeout(timer);
      timer=setTimeout(function(){ fn.apply(self,args); },wait);
    };
  }
  function deepClone(o){ return o==null?o:JSON.parse(JSON.stringify(o)); }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function getByPath(obj,path){
    return String(path).split('.').reduce(function(o,k){ return o==null?undefined:o[k]; },obj);
  }
  function setByPath(obj,path,val){
    var ks=String(path).split('.'),o=obj,i;
    for(i=0;i<ks.length-1;i++){
      if(o[ks[i]]==null||typeof o[ks[i]]!=='object') o[ks[i]]={};
      o=o[ks[i]];
    }
    o[ks[ks.length-1]]=val;
  }
  function base36(n){ var s=''; while(n-->0) s+=Math.floor(Math.random()*36).toString(36); return s; }
  function genRnd(prefix,len){ return (prefix||'')+base36(len||8); }
  function nowIso(){ return new Date().toISOString(); }
  window.XTR.util={
    clamp:clamp,throttle:throttle,debounce:debounce,deepClone:deepClone,escapeHtml:escapeHtml,
    getByPath:getByPath,setByPath:setByPath,base36:base36,genRnd:genRnd,nowIso:nowIso
  };
})();

/* ================= 分区 4：文档模型 ================= */
(function(){
  var U=XTR.util;
  var KNOWN_TOP=['schema_version','kind','meta','runtime','nodes','edges','x'];
  var KNOWN_NODE=['id','type','label','config'];
  var KNOWN_EDGE=['from','to','from_port','to_port','label'];
  var KNOWN_LAYOUT_TOP=['schema_version','kind','meta','viewport','canvas','nodes','edges','groups','ui'];

  function genId(prefix,existing){
    var used=new Set(existing||[]);
    var id,i=0;
    do{
      id=prefix+Date.now().toString(36).slice(-4)+U.base36(4);
      if(i>0) id+='_'+i;
      i++;
    }while(used.has(id));
    return id;
  }
  function newPipeline(){
    return {
      schema_version:XTR.SCHEMA_VERSION,
      kind:'pipeline',
      meta:{name:'未命名管线',pipeline_id:genId('pl_'),version:'1.0.0'},
      runtime:{output_dir:'output',concurrency:1,continue_on_error:false},
      nodes:[],
      edges:[]
    };
  }
  function newLayout(pipelineId){
    return {
      schema_version:XTR.SCHEMA_VERSION,
      kind:'layout',
      meta:{pipeline_id:pipelineId||genId('pl_'),name:''},
      viewport:{x:40,y:40,zoom:1},
      canvas:{grid:{size:20,visible:true},background:'#0f1115'},
      nodes:{}
    };
  }
  function newNode(type,existingIds){
    var nt=XTR.nodeTypes.get(type);
    if(!nt) return null;
    return {id:genId('n_',existingIds),type:type,label:'',config:U.deepClone(nt.defaultConfig())};
  }
  function _deepMerge(base,over){
    if(over==null) return base;
    if(typeof base!=='object'||base===null||Array.isArray(base)) return U.deepClone(over);
    var out=U.deepClone(base);
    Object.keys(over).forEach(function(k){
      if(typeof over[k]==='object'&&over[k]!==null&&!Array.isArray(over[k])&&typeof out[k]==='object'&&out[k]!==null&&!Array.isArray(out[k]))
        out[k]=_deepMerge(out[k],over[k]);
      else
        out[k]=U.deepClone(over[k]);
    });
    return out;
  }
  function normalize(doc,opts){
    opts=opts||{};
    var warnings=[];
    if(!doc||typeof doc!=='object'||Array.isArray(doc))
      return {doc:null,warnings:['文件内容不是有效的 JSON 对象']};
    if(doc.kind==='pipeline') return _np(doc,warnings);
    if(doc.kind==='layout') return _nl(doc,warnings);
    return {doc:null,warnings:['未知的 kind 值：'+String(doc.kind)]};
  }
  function _np(doc,warnings){
    var out={schema_version:doc.schema_version||XTR.SCHEMA_VERSION,kind:'pipeline',meta:{},runtime:{},nodes:[],edges:[]};
    if(doc.x&&typeof doc.x==='object') out.x=U.deepClone(doc.x);   /* 扩展袋：流谱格式独有字段 */
    var unknown={};
    Object.keys(doc).forEach(function(k){
      if(KNOWN_TOP.indexOf(k)<0){ unknown[k]=U.deepClone(doc[k]); warnings.push('未知的顶层字段已保留：'+k); }
    });
    if(Object.keys(unknown).length) out._unknown=unknown;
    var m=doc.meta||{};
    out.meta.name=(typeof m.name==='string'&&m.name.length)?m.name:'未命名管线';
    if(!m.name) warnings.push('meta.name 缺失，已使用默认值「未命名管线」');
    ['description','version','author','pipeline_id'].forEach(function(k){ if(m[k]!==undefined) out.meta[k]=m[k]; });
    if(!out.meta.pipeline_id) out.meta.pipeline_id=genId('pl_');
    var r=doc.runtime||{};
    out.runtime.output_dir=r.output_dir||'output';
    out.runtime.concurrency=typeof r.concurrency==='integer'||typeof r.concurrency==='number'?r.concurrency:1;
    out.runtime.continue_on_error=!!r.continue_on_error;
    var usedIds=[];
    (doc.nodes||[]).forEach(function(rn,idx){
      if(!rn||typeof rn!=='object'){ warnings.push('第 '+(idx+1)+' 个节点不是对象，已忽略'); return; }
      var nt=XTR.nodeTypes.get(rn.type);
      if(!nt){
        out.nodes.push(U.deepClone(rn));
        warnings.push('节点 '+(rn.id||('第'+(idx+1)+'个'))+' 类型未知：'+String(rn.type)+'，已原样保留');
        return;
      }
      var node={id:typeof rn.id==='string'&&rn.id?rn.id:genId('n_',usedIds.concat(out.nodes.map(function(n){return n.id;}))),
        type:rn.type,label:typeof rn.label==='string'?rn.label:''};
      if(usedIds.indexOf(node.id)>=0){ node.id=genId('n_',out.nodes.map(function(n){return n.id;})); warnings.push('节点 id 重复，已自动生成新 id：'+node.id); }
      usedIds.push(node.id);
      node.config=_deepMerge(nt.defaultConfig(),rn.config||{});
      var nu={};
      Object.keys(rn).forEach(function(k){
        if(KNOWN_NODE.indexOf(k)<0){ nu[k]=U.deepClone(rn[k]); warnings.push('节点 '+node.id+' 包含未知字段已保留：'+k); }
      });
      if(Object.keys(nu).length) node._unknown=nu;
      out.nodes.push(node);
    });
    (doc.edges||[]).forEach(function(re,idx){
      if(!re||typeof re!=='object'){ warnings.push('第 '+(idx+1)+' 条连线不是对象，已忽略'); return; }
      var e={};
      ['from','to','from_port','to_port','label'].forEach(function(k){ if(re[k]!==undefined) e[k]=re[k]; });
      var eu={};
      Object.keys(re).forEach(function(k){
        if(KNOWN_EDGE.indexOf(k)<0){ eu[k]=U.deepClone(re[k]); warnings.push('一条连线包含未知字段已保留：'+k); }
      });
      if(Object.keys(eu).length) e._unknown=eu;
      out.edges.push(e);
    });
    return {doc:out,warnings:warnings};
  }
  function _nl(doc,warnings){
    var N=function(v,d){ return typeof v==='number'&&isFinite(v)?v:d; };

      }
    });
    XTR.model.checkPromptVars(doc).forEach(function(x){
      warnings.push({nodeId:x.nodeId,message:'提示词变量 {{ '+x.var+' }} 悬空：'+x.reason});
    });
    return {errors:errors,warnings:warnings};
  }
  window.XTR.validate={
    SCHEMA:{pipeline:PIPELINE_SCHEMA,layout:LAYOUT_SCHEMA},
    validate:validate,
    checkSchema:checkSchema,
    checkCompatibility:checkCompatibility,
    pipelinePreflight:pipelinePreflight
  };
})();

/* ================= 分区 6：图数据（唯一写入口） ================= */
(function(){
  var U=XTR.util;
  var pipeline=null,layout=null;
  var past=[],future=[];
  var MAXH=100;
  function _node(p,id){ return p.nodes.find(function(n){return n.id===id;}); }

    if(!l||!l.nodes) return null;

  }

  }
  function _emit(){ XTR.bus.emit(XTR.EVENTS.DOC_CHANGED); }

  function commit(before){ _push(before); _emit(); }

  function updateSilent(fn){ fn(pipeline,layout); _emit(); }
  function emitChange(){ _emit(); }

  }
  function redo(){

    pipeline=s.pipeline; layout=s.layout;

  }

    var nt=XTR.nodeTypes.get(type);

    var id=XTR.model.genId('n_',_allIds(pipeline));
    var node={id:id,type:type,label:(overrides&&overrides.label)||''};
    node.config=overrides&&overrides.config?U.deepClone(overrides.config):U.deepClone(nt.defaultConfig());

  }

    opts=opts||{};

    Object.keys(depth).forEach(function(id){
      var d=depth[id];

  }
  window.XTR.graph={
    edgeKey:edgeKey,
    getDocs:getDocs,setDocs:setDocs,
    addNode:addNode,pasteNodes:pasteNodes,
    removeNodes:removeNodes,removeEdges:removeEdges,deleteSelection:deleteSelection,
    moveNodes:moveNodes,setNodeConfigs:setNodeConfigs,setMetaName:setMetaName,

    topoSort:topoSort,autoLayout:autoLayout,
    undo:undo,redo:redo,canUndo:function(){return past.length>0;},canRedo:function(){return future.length>0;},
    clearHistory:clearHistory,
    snapshot:snapshot,commit:commit,update:update,updateSilent:updateSilent,emitChange:emitChange
  };
})();

/* ================= 分区 7：视图渲染 ================= */
(function(){

  }

  }

    var r=svg.getBoundingClientRect();

  }

    var pos=_layoutPos(nodeId),g=_geom(node);

      nodes:(sel.nodes||[]).filter(function(id){return nids.has(id);}),

    var nodes=docs.pipeline.nodes;
    for(var i=nodes.length-1;i>=0;i--){
      var n=nodes[i],p=_layoutPos(n.id),g=_geom(n);
      if(wx>=p.x-4&&wx<=p.x+NODE_W+4&&wy>=p.y-4&&wy<=p.y+g.h+4) return n.id;
    }
    return null;
  }
  function hitTestPort(wx,wy,side){
    var docs=XTR.graph.getDocs();
    var r=U.clamp(10/t.k,9,40),best=null,bd=r*r;
    docs.pipeline.nodes.forEach(function(n){
      var p=_layoutPos(n.id),g=_geom(n);
      var arr=side==='in'?(n.config.inputs||[]):(n.config.outputs||[]);
      arr.forEach(function(pt,i){
        var cy=p.y+(side==='in'?g.inY[i]:g.outY[i]);
        var px=side==='in'?p.x:p.x+NODE_W;
        var d=(px-wx)*(px-wx)+(cy-wy)*(cy-wy);
        if(d<=bd){ bd=d; best={nodeId:n.id,port:pt.id,side:side,x:px,y:cy}; }
      });
    });
    return best;
  }
  function hitTestEdge(wx,wy){
    var children=Array.prototype.slice.call(layerEdges.children);
    for(var i=children.length-1;i>=0;i--){
      var hit=children[i].querySelector('.edge-hit');
      if(!hit) continue;
      var len=hit.getTotalLength();
      for(var s=0;s<=len;s+=12){
        var p=hit.getPointAtLength(s);
        if((p.x-wx)*(p.x-wx)+(p.y-wy)*(p.y-wy)<=81) return children[i].getAttribute('data-edge-id');
      }
    }
    return null;
  }
  function getNodeBBoxes(){
    var docs=XTR.graph.getDocs();
    return docs.pipeline.nodes.map(function(n){
      var p=_layoutPos(n.id),g=_geom(n);
      return {id:n.id,x1:p.x,y1:p.y,x2:p.x+NODE_W,y2:p.y+g.h};
    });
  }
  function fitToContent(){
    var docs=XTR.graph.getDocs();
    if(!docs.pipeline.nodes.length){ resetViewport(); return; }
    var bx=Infinity,by=Infinity,bx2=-Infinity,by2=-Infinity;
    docs.pipeline.nodes.forEach(function(n){
      var p=_layoutPos(n.id),g=_geom(n);
      bx=Math.min(bx,p.x);by=Math.min(by,p.y);
      bx2=Math.max(bx2,p.x+NODE_W);by2=Math.max(by2,p.y+g.h);
    });
    var pad=60;
    var bw=bx2-bx+pad*2,bh=by2-by+pad*2;
    var r=svg.getBoundingClientRect();
    if(r.width<10||r.height<10) return;
    var k=U.clamp(Math.min(r.width/bw,r.height/bh),0.25,2.5);
    t.k=k;
    t.x=(r.width-(bx2-bx)*k)/2-bx*k;
    t.y=(r.height-(by2-by)*k)/2-by*k;
    renderViewport();
  }
  function viewportCenterWorld(){
    var r=svg.getBoundingClientRect();
    return screenToWorld(r.left+r.width/2,r.top+r.height/2);
  }
  function setGridVisible(v){ layerGrid.style.display=v?'':'none'; }
  window.XTR.view={
    mount:mount,NODE_W:NODE_W,
    renderAll:renderAll,renderNodes:renderNodes,renderEdges:renderEdges,renderViewport:renderViewport,
    screenToWorld:screenToWorld,worldToScreen:worldToScreen,
    hitTestNode:hitTestNode,hitTestPort:hitTestPort,hitTestEdge:hitTestEdge,
    setSelection:setSelection,getSelection:getSelection,
    drawTempLink:drawTempLink,clearTempLink:clearTempLink,
    drawSelectionBox:drawSelectionBox,clearSelectionBox:clearSelectionBox,
    fitToContent:fitToContent,resetViewport:resetViewport,
    zoomAt:zoomAt,getTransform:getTransform,setTransform:setTransform,
    updateNodePos:updateNodePos,portWorldPos:portWorldPos,
    getNodeBBoxes:getNodeBBoxes,viewportCenterWorld:viewportCenterWorld,
    setGridVisible:setGridVisible
  };
})();

/* ================= 分区 8：交互（指针状态机 / 快捷键） ================= */
(function(){
  var U=XTR.util;
  var svg,wrap;
  var S={mode:'idle'};
  var spaceDown=false;
  var clipboard=[];
  function init(){
    svg=document.getElementById('canvas');
    wrap=document.getElementById('canvas-wrap');
    svg.addEventListener('pointerdown',_down);
    window.addEventListener('pointermove',_move);
    window.addEventListener('pointerup',_up);
    window.addEventListener('keydown',_keyDown);
    window.addEventListener('keyup',_keyUp);
    wrap.addEventListener('wheel',_wheel,{passive:false});
    svg.addEventListener('contextmenu',function(e){ e.preventDefault(); if(_suppressCtxOnce){ _suppressCtxOnce=false; return; } _ctxMenu(e); });
    window.addEventListener('pointerdown',function(e){ if(ctxEl&&!ctxEl.contains(e.target)) _closeCtx(); },true);
    window.addEventListener('blur',_closeCtx);
  }
  function _isBlank(e){
    var t=e.target;
    return !(t.closest&&t.closest('.node,.port,g.edge'));
  }
  function _startPan(e){
    S.mode='pan';
    S.panBtn=e.button;
    S.panned=false;
    S.lastX=e.clientX;S.lastY=e.clientY;
    try{ svg.setPointerCapture(e.pointerId); }catch(err){}
    wrap.classList.add('panning');
  }
  function _down(e){
    if(S.mode!=='idle') return;
    if(e.button===1||(e.button===0&&spaceDown)){
      e.preventDefault();
      _startPan(e);
      return;
    }
    if(e.button===2){
      if(_isBlank(e)){ S.mode='rpend'; S.lastX=e.clientX; S.lastY=e.clientY; }
      return;
    }
    if(e.button!==0) return;
    var pt=XTR.view.screenToWorld(e.clientX,e.clientY);
    var portEl=e.target.closest?e.target.closest('.port'):null;
    if(portEl){
      var from={
        nodeId:portEl.getAttribute('data-node-id'),
        port:portEl.getAttribute('data-port'),
        side:portEl.getAttribute('data-side')
      };
      var pos=XTR.view.portWorldPos(from.nodeId,from.port,from.side);
      if(!pos) return;
      S.mode='link';
      S.from=from;
      S.fromPos=pos;
      S.target=null;
      S.conn=null;
      try{ svg.setPointerCapture(e.pointerId); }catch(err){}
      XTR.view.drawTempLink(pos.x,pos.y,pt.x,pt.y,false);
      return;
    }
    var nodeEl=e.target.closest?e.target.closest('.node'):null;
    if(nodeEl){
      var id=nodeEl.getAttribute('data-id');
      var sel=XTR.view.getSelection();
      var ids;
      if(e.shiftKey){
        ids=sel.nodes.indexOf(id)>=0?sel.nodes.filter(function(x){return x!==id;}):sel.nodes.concat([id]);
      }else{
        ids=sel.nodes.indexOf(id)>=0?sel.nodes.slice():[id];
      }
      XTR.view.setSelection({nodes:ids,edges:[]});
      S.mode='node';
      S.ids=ids;
      S.start=pt;
      S.orig={};
      var docs=XTR.graph.getDocs();
      ids.forEach(function(nid){
        var ln=docs.layout.nodes[nid];
        S.orig[nid]=ln?{x:ln.x,y:ln.y}:{x:0,y:0};
      });
      S.before=XTR.graph.snapshot();
      S.moved=false;
      try{ svg.setPointerCapture(e.pointerId); }catch(err){}
      return;
    }
    var edgeEl=e.target.closest?e.target.closest('g.edge'):null;
    if(edgeEl){
      XTR.view.setSelection({nodes:[],edges:[edgeEl.getAttribute('data-edge-id')]});
      return;
    }
    /* 空白：默认平移画布（整体移动）；Ctrl/⌘+拖拽=框选 */
    if(e.ctrlKey||e.metaKey){
      S.mode='box';
      S.start=pt;
      S.cur=pt;
      S.baseSel=e.shiftKey?XTR.view.getSelection().nodes.slice():[];
      if(!e.shiftKey) XTR.view.setSelection({nodes:[],edges:[]});
      try{ svg.setPointerCapture(e.pointerId); }catch(err){}
      return;
    }
    _startPan(e);
    S.clearOnClick=!e.shiftKey;
  }
  function _move(e){
    if(S.mode==='idle') return;
    if(S.mode==='rpend'){
      if(Math.abs(e.clientX-S.lastX)+Math.abs(e.clientY-S.lastY)>4){
        S.mode='pan'; S.panBtn=2; S.panned=true;
        try{ svg.setPointerCapture(e.pointerId); }catch(err){}
        wrap.classList.add('panning');
      }
      return;
    }
    if(S.mode==='pan'){
      var t=XTR.view.getTransform();
      var pdx=e.clientX-S.lastX,pdy=e.clientY-S.lastY;
      if(Math.abs(pdx)+Math.abs(pdy)>0.5) S.panned=true;
      t.x+=pdx;
      t.y+=pdy;
      S.lastX=e.clientX;S.lastY=e.clientY;
      XTR.view.setTransform(t);
      return;
    }
    var pt=XTR.view.screenToWorld(e.clientX,e.clientY);
    if(S.mode==='node'){
      var dx=pt.x-S.start.x,dy=pt.y-S.start.y;
      if(!S.moved&&Math.abs(dx)+Math.abs(dy)<2) return;
      S.moved=true;
      XTR.graph.moveNodes(S.ids,dx,dy,{commit:false,snap:!e.altKey,orig:S.orig});
      S.ids.forEach(function(id){
        var docs=XTR.graph.getDocs();
        var ln=docs.layout.nodes[id];
        if(ln) XTR.view.updateNodePos(id,ln.x,ln.y);
      });
      return;
    }
    if(S.mode==='link'){
      var wantSide=S.from.side==='out'?'in':'out';
      var target=XTR.view.hitTestPort(pt.x,pt.y,wantSide);
      if(target&&target.nodeId===S.from.nodeId&&target.port===S.from.port) target=null;
      S.target=target;
      S.conn=null;
      var tx=target?target.x:pt.x,ty=target?target.y:pt.y,invalid=false;
      if(target){
        var a,b;
        if(S.from.side==='out'){ a={node:S.from.nodeId,port:S.from.port}; b={node:target.nodeId,port:target.port}; }
        else{ a={node:target.nodeId,port:target.port}; b={node:S.from.nodeId,port:S.from.port}; }
        var r=XTR.graph.canConnect(a.node,a.port,b.node,b.port);
        invalid=!r.ok;
        S.conn={from:a,to:b};
      }
      XTR.view.drawTempLink(S.fromPos.x,S.fromPos.y,tx,ty,invalid);
      return;
    }
    if(S.mode==='box'){
      S.cur=pt;
      XTR.view.drawSelectionBox(S.start.x,S.start.y,pt.x,pt.y);
    }
  }
  function _up(e){
    if(S.mode==='idle') return;
    var mode=S.mode;
    S.mode='idle';
    try{ svg.releasePointerCapture(e.pointerId); }catch(err){}
    wrap.classList.remove('panning');
    if(mode==='rpend') return;
    if(mode==='pan'){
      if(S.panned&&S.panBtn===2) _suppressCtxOnce=true;
      if(!S.panned&&S.panBtn===0&&S.clearOnClick) XTR.view.setSelection({nodes:[],edges:[]});
      S.panned=false; S.clearOnClick=false;
      return;
    }
    if(mode==='node'){
      if(S.moved&&S.before) XTR.graph.commit(S.before);
      S.before=null;
      return;
    }
    if(mode==='link'){
      if(S.target&&S.conn){
        var r=XTR.graph.canConnect(S.conn.from.node,S.conn.from.port,S.conn.to.node,S.conn.to.port);
        if(!r.ok) XTR.ui.toast(r.reason,'danger');
        else{
          var ok=XTR.graph.addEdge(S.conn.from.node,S.conn.from.port,S.conn.to.node,S.conn.to.port);
          if(ok.ok) XTR.ui.toast('已创建连线','success');
        }
      }
      XTR.view.clearTempLink();
      return;
    }
    if(mode==='box'){
      var x1=Math.min(S.start.x,S.cur.x),y1=Math.min(S.start.y,S.cur.y);
      var x2=Math.max(S.start.x,S.cur.x),y2=Math.max(S.start.y,S.cur.y);
      var moved=(x2-x1)+(y2-y1)>3;
      var ids=[];
      if(moved){
        XTR.view.getNodeBBoxes().forEach(function(b){
          if(b.x1<=x2&&b.x2>=x1&&b.y1<=y2&&b.y2>=y1) ids.push(b.id);
        });
      }
      var final=S.baseSel.slice();
      ids.forEach(function(id){ if(final.indexOf(id)<0) final.push(id); });
      XTR.view.clearSelectionBox();
      XTR.view.setSelection({nodes:final,edges:[]});
    }
  }
  function _wheel(e){
    e.preventDefault();
    var oldK=XTR.view.getTransform().k;
    var nk=U.clamp(oldK*Math.exp(-e.deltaY*0.0012),0.25,2.5);
    XTR.view.zoomAt(e.clientX,e.clientY,nk);
  }
  function _inEditable(t){
    if(!t) return false;
    var tag=(t.tagName||'').toLowerCase();
    return tag==='input'||tag==='textarea'||tag==='select'||t.isContentEditable;
  }
  function _keyDown(e){
    if(_inEditable(e.target)) return;
    if(e.key===' '){ spaceDown=true; if(e.target===document.body) e.preventDefault(); return; }
    var mod=e.ctrlKey||e.metaKey;
    if(e.key==='Escape'){
      _closeCtx();
      XTR.view.clearTempLink();
      XTR.view.clearSelectionBox();
      XTR.view.setSelection({nodes:[],edges:[]});
      return;
    }
    if(e.key==='Delete'||e.key==='Backspace'){
      var sel=XTR.view.getSelection();
      if(sel.nodes.length||sel.edges.length){
        e.preventDefault();
        deleteSelection();
      }
      return;
    }
    var k=(e.key||'').toLowerCase();
    if(mod&&!e.shiftKey&&k==='z'){ e.preventDefault(); if(XTR.graph.undo()){} return; }
    if((mod&&e.shiftKey&&k==='z')||(mod&&k==='y')){ e.preventDefault(); XTR.graph.redo(); return; }
    if(mod&&k==='c'){
      var sel2=XTR.view.getSelection();
      if(sel2.nodes.length){ e.preventDefault(); copySelection(); }
      return;
    }
    if(mod&&k==='v'){ e.preventDefault(); pasteClipboard(); return; }
    if(mod&&k==='a'){
      e.preventDefault();
      var dA=XTR.graph.getDocs();
      XTR.view.setSelection({nodes:dA.pipeline.nodes.map(function(n){return n.id;}),edges:[]});
      return;
    }
    if(mod&&!e.shiftKey&&k==='s'){
      e.preventDefault();
      var dS=XTR.graph.getDocs();
      if(dS&&dS.pipeline){ XTR.store.saveNow(); XTR.ui.toast('已手动保存当前会话','success'); }
      return;
    }
    if(mod&&k==='e'){ e.preventDefault(); XTR.io.exportPipeline(); return; }
    if(mod&&k==='x'){
      var selX=XTR.view.getSelection();
      if(selX.nodes.length){ e.preventDefault(); copySelection(); deleteSelection(); }
      return;
    }
    if(mod&&k==='0'){
      e.preventDefault();
      var r0=svg.getBoundingClientRect();
      XTR.view.zoomAt(r0.left+r0.width/2,r0.top+r0.height/2,1);
      return;
    }
  }
  function _keyUp(e){
    if(e.key===' ') spaceDown=false;
  }
  function copySelection(){
    var docs=XTR.graph.getDocs();
    var sel=XTR.view.getSelection();
    clipboard=[];
    sel.nodes.forEach(function(id){
      var n=docs.pipeline.nodes.find(function(x){return x.id===id;});
      var ln=docs.layout.nodes[id];
      if(n&&ln) clipboard.push({type:n.type,label:n.label,config:U.deepClone(n.config),x:ln.x,y:ln.y});
    });
    if(clipboard.length) XTR.ui.toast('已复制 '+clipboard.length+' 个节点','info');
  }
  function pasteClipboard(){
    if(!clipboard.length) return;
    var created=XTR.graph.pasteNodes(clipboard,24,24);
    if(created.length){
      XTR.view.setSelection({nodes:created,edges:[]});
      XTR.ui.toast('已粘贴 '+created.length+' 个节点','success');
    }
  }
  function deleteSelection(){
    var sel=XTR.view.getSelection();
    if(!sel.nodes.length&&!sel.edges.length) return;
    XTR.graph.deleteSelection(sel.nodes,sel.edges);
    XTR.ui.toast('已删除 '+(sel.nodes.length+' 个节点'+(sel.edges.length?('、'+sel.edges.length+' 条连线'):'')),'info');
  }
  var ctxEl=null;
  var _suppressCtxOnce=false;
  function _closeCtx(){
    if(ctxEl&&ctxEl.parentNode) ctxEl.parentNode.removeChild(ctxEl);
    ctxEl=null;
  }
  function _showCtx(x,y,items){
    _closeCtx();
    var m=document.createElement('div');
    m.className='ctx-menu';
    items.forEach(function(it){
      if(it.sep){ var sp=document.createElement('div'); sp.className='ctx-sep'; m.appendChild(sp); return; }
      var b=document.createElement('button');
      b.type='button';
      b.className='ctx-item'+(it.danger?' danger':'');
      b.textContent=it.label;
      if(it.disabled) b.disabled=true;
      else b.addEventListener('click',function(){ _closeCtx(); try{ it.onClick(); }catch(err){} });
      m.appendChild(b);
    });
    document.body.appendChild(m);
    var r=m.getBoundingClientRect();
    m.style.left=Math.max(4,Math.min(x,window.innerWidth-r.width-8))+'px';
    m.style.top=Math.max(4,Math.min(y,window.innerHeight-r.height-8))+'px';
    ctxEl=m;
  }
  function _createAt(type,pt){
    var n=XTR.graph.addNode(type,pt.x,pt.y);
    if(n&&n.id) XTR.view.setSelection({nodes:[n.id],edges:[]});
  }
  function _ctxMenu(e){
    var t=e.target;
    var nodeEl=t&&t.closest?t.closest('g.node'):null;
    if(nodeEl){
      var id=nodeEl.getAttribute('data-id');
      var sel=XTR.view.getSelection();
      if(sel.nodes.indexOf(id)<0) XTR.view.setSelection({nodes:[id],edges:[]});
      _showCtx(e.clientX,e.clientY,[
        {label:'复制节点',onClick:function(){ copySelection(); }},
        {label:'删除节点',danger:true,onClick:function(){ deleteSelection(); }}
      ]);
      return;
    }
    var edgeEl=t&&t.closest?t.closest('g.edge'):null;
    if(edgeEl){
      XTR.view.setSelection({nodes:[],edges:[edgeEl.getAttribute('data-edge-id')]});
      _showCtx(e.clientX,e.clientY,[
        {label:'删除连线',danger:true,onClick:function(){ deleteSelection(); }}
      ]);
      return;
    }
    var pt=XTR.view.screenToWorld(e.clientX,e.clientY);
    _showCtx(e.clientX,e.clientY,[
      {label:'粘贴节点',disabled:!clipboard.length,onClick:function(){ pasteClipboard(); }},
      {sep:true},
      {label:'新建「输入」节点',onClick:function(){ _createAt('input',pt); }},
      {label:'新建「模型调用」节点',onClick:function(){ _createAt('model_call',pt); }},
      {label:'新建「输出」节点',onClick:function(){ _createAt('output',pt); }},
      {sep:true},
      {label:'适应画布',onClick:function(){ XTR.view.fitToContent(); }}
    ]);
  }
  window.XTR.interact={
    init:init,
    copySelection:copySelection,
    pasteClipboard:pasteClipboard,
    deleteSelection:deleteSelection
  };
})();

/* ================= 分区 9：属性面板 ================= */
(function(){
  var U=XTR.util;
  var emptyEl,formEl;
  var currentId=null;
  var _fields=[];
  function mount(containerEl){
    emptyEl=containerEl.querySelector('#inspector-empty');
    formEl=containerEl.querySelector('#inspector-form');
  }
  function _el(tag,cls,parent){
    var e=document.createElement(tag);
    if(cls) e.className=cls;
    if(parent) parent.appendChild(e);
    return e;
  }
  function _findNode(p,id){ return p.nodes.find(function(n){return n.id===id;}); }
  function _getVal(node,f){
    if(f.key==='label') return node.label||'';
    var v=U.getByPath(node.config||{},f.key);
    return v==null?'':v;
  }
  function _setSilent(key,val){
    XTR.graph.updateSilent(function(p){
      var n=_findNode(p,currentId);
      if(!n) return;
      if(key==='label') n.label=val;
      else U.setByPath(n.config,key,val);
    });
  }
  function _setMsg(msgEl,res){
    if(!res){ msgEl.textContent=''; msgEl.className='field-msg'; return; }
    msgEl.textContent=res.error||res.warn||'';
    msgEl.className='field-msg '+(res.error?'err':'warn');
  }
  function _liveCheck(node,f,msgEl,input){
    if(!f.validate){ _setMsg(msgEl,null); return; }
    _setMsg(msgEl,f.validate(input.value,node));
  }
  function _hlHtml(text,dangling){
    return U.escapeHtml(text).replace(/\{\{\s*([A-Za-z0-9_.]+)\s*\}\}/g,function(m,v){
      return '<mark class="'+(dangling.has(v)?'dangling':'')+'">'+v+'</mark>';
    });
  }
  function show(nodeId){
    var docs=XTR.graph.getDocs();
    var node=_findNode(docs.pipeline,nodeId);
    if(!node){ hide(); return; }
    currentId=nodeId;
    emptyEl.style.display='none';
    formEl.style.display='';
    _build(node);
  }
  function hide(){
    currentId=null;
    _fields=[];
    formEl.innerHTML='';
    formEl.style.display='none';
    emptyEl.style.display='';
  }
  function refresh(){
    if(!currentId) return;
    var docs=XTR.graph.getDocs();
    var node=_findNode(docs.pipeline,currentId);
    if(!node){ hide(); return; }
    _fields.forEach(function(rec){
      var f=rec.def;
      if(f.visibleIf) rec.wrap.style.display=f.visibleIf(node)?'':'none';
      if(rec.input&&rec.input!==document.activeElement){
        var v=_getVal(node,f);
        if(String(rec.input.value)!==String(v)) rec.input.value=String(v);
      }
      if(rec.update) rec.update(node);
    });
  }
  function _build(node){
    var nt=XTR.nodeTypes.get(node.type);
    formEl.innerHTML='';
    _fields=[];
    var head=_el('div','insp-head',formEl);
    var ty=_el('div','insp-type',head); ty.textContent=nt.label;
    var idv=_el('div','insp-id',head); idv.textContent=node.id;
    nt.fields.forEach(function(f){
      if(f.visibleIf&&!f.visibleIf(node)) return;
      var wrap=_el('div','field',formEl);
      wrap.style.display='';
      var rec={def:f,wrap:wrap,input:null,update:null,before:null,dirty:false};
      _buildControl(node,f,wrap,rec);
      if(wrap.parentNode===formEl){} /* keep order */
      _fields.push(rec);
    });
    /* 重新按声明顺序排列（visibleIf 字段已按序创建） */
    _fields.forEach(function(rec){ formEl.appendChild(rec.wrap); });
    /* fix12：模型调用节点在「模型名」字段下方注入连通测试框 */
    if(node.type==='model_call'){
      var mrec=null;
      _fields.forEach(function(rec){ if(rec.def&&rec.def.key==='model') mrec=rec; });
      if(mrec&&mrec.wrap.parentNode===formEl){
        formEl.insertBefore(_buildConnTest(node),mrec.wrap.nextSibling);
      }
    }
  }
  function _labelRow(f,wrap){
    var lab=_el('label','field-label',wrap);
    var span=document.createElement('span');
    span.textContent=f.label;
    lab.appendChild(span);
if(f.required){
      var star=_el('span','req',lab);
      star.textContent='*';
    }
    if(f.tooltip){
      var tip=_el('span','tip',lab);
      tip.textContent='?';
      var bub=_el('span','tip-bubble',tip);
      bub.textContent=f.tooltip;
      tip.addEventListener('mouseenter',function(){
        bub.style.display='block';
        var r=tip.getBoundingClientRect();
        var br=bub.getBoundingClientRect();
        bub.style.left=Math.max(12,Math.min(window.innerWidth-br.width-12,r.right-br.width))+'px';
        var top=r.top-br.height-8;
        if(top<8) top=r.bottom+8;
        bub.style.top=top+'px';
      });
      tip.addEventListener('mouseleave',function(){ bub.style.display='none'; });
    }
  }
  function _curNode(){
    var docs=XTR.graph.getDocs();
    return currentId?_findNode(docs.pipeline,currentId):null;
  }
  function _applyProviderSide(n){
    var cur=(n.config&&n.config.provider)||{};
    var pid=cur.id||'';
    var prov=XTR.providers.get(pid);
    if(!prov) return;
    if(prov.channel==='custom'){
      n.config.provider={id:'custom',
        label:(cur.channel==='custom'&&cur.label)?cur.label:'自定义渠道',
        channel:'custom',
        base_url:(cur.channel==='custom'&&cur.base_url)?cur.base_url:'',
        api_key_env:(cur.channel==='custom'&&cur.api_key_env)?cur.api_key_env:''};
    }else{
      n.config.provider={id:prov.id,label:prov.label,channel:prov.channel,
        base_url:prov.base_url||'',api_key_env:prov.api_key_env||''};
      if(!n.config.model&&prov.models&&prov.models.length) n.config.model=prov.models[0];
    }
  }
  function _validVars(){
    var docs=XTR.graph.getDocs();
    var set=new Set();
    var hasInput=false;
    (docs.pipeline.nodes||[]).forEach(function(n){
      var nt=XTR.nodeTypes.get(n.type);
      if(!nt) return;
      if(n.type==='input') hasInput=true;
      ((n.config&&n.config.outputs)||[]).forEach(function(p){
        var pid=(p&&p.id)?p.id:p;
        set.add('node.'+n.id+'.'+pid);
      });
    });
    if(hasInput) set.add('input.text');
    return set;
  }
  function _danglingSet(text){
    var valid=_validVars();
    var bad=new Set();
    var vars=[];
    try{ vars=XTR.model.extractPromptVars(text)||[]; }catch(e){ vars=[]; }
    vars.forEach(function(v){ if(!valid.has(v)) bad.add(v); });
    return bad;
  }
  function _applyChange(f,val,msgEl){
    XTR.graph.updateSilent(function(p){
      var n=_findNode(p,currentId);
      if(!n) return;
      if(f.key==='label') n.label=val;
      else U.setByPath(n.config,f.key,val);
      if(typeof f.onChange==='function'){ f.onChange(n); }
      else if(f.key==='provider.id'){ _applyProviderSide(n); }
    });
    var n=_curNode();
    if(n&&f.validate&&msgEl) _liveCheck(n,f,msgEl,{value:val});
    /* fix12：切换渠道后整体重建表单（连通测试框、base_url 只读态、可见性随之刷新） */
    if(f.key==='provider.id'&&n){ _build(n); return; }
    refresh();
    _maybeRebuild();
  }
  /* visibleIf 状态发生变化时（如切换到自定义渠道/自定义扩展名），整体重建表单 */
  function _maybeRebuild(){
    var n=_curNode();
    if(!n) return;
    var nt=XTR.nodeTypes.get(n.type);
    if(!nt) return;
    var changed=false;
    nt.fields.forEach(function(f){
      var shouldShow=!f.visibleIf||f.visibleIf(n);
      var built=_fields.some(function(r){ return r.def===f; });
      if(shouldShow!==built) changed=true;
    });
    if(changed) _build(n);
  }
  function _buildControl(node,f,wrap,rec){
    _labelRow(f,wrap);
    var msg=_el('div','field-msg',wrap);
    var w=f.widget||'text';
    if(w==='select') _buildSelect(node,f,wrap,rec,msg);
    else if(w==='prompt') _buildPrompt(node,f,wrap,rec,msg);
    else if(w==='checkbox') _buildCheckbox(node,f,wrap,rec,msg);
    else if(w==='textarea') _buildTextarea(node,f,wrap,rec,msg);
    else if(w==='schema') _buildSchema(node,f,wrap,rec,msg);
    else _buildText(node,f,wrap,rec,msg);
    if(w!=='prompt'&&f.validate){
      _liveCheck(node,f,msg,{value:_getVal(node,f)});
    }
  }
  function _buildText(node,f,wrap,rec,msg){
    var input=document.createElement('input');
    input.type='text';
    input.className='ctl';
    input.value=_getVal(node,f);
    if(f.placeholder) input.placeholder=f.placeholder;
    rec.input=input;
    if(f.key==='base_url'||typeof f.readonlyIf==='function'||typeof f.readOnlyIf==='function'){
      rec.update=function(n){
        var ro=false;
        var roFn=f.readonlyIf||f.readOnlyIf;
        if(f.key==='base_url'){
          var pid=(n.config&&n.config.provider&&n.config.provider.id)||'';
          ro=(pid!=='custom');
        }
        if(typeof roFn==='function'&&roFn(n)) ro=true;
        input.readOnly=ro;
      };
      rec.update(node);
    }
    input.addEventListener('input',function(){
      _setSilent(f.key,input.value);
      var n=_curNode()||node;
      _liveCheck(n,f,msg,input);
      refresh();
    });
    input.addEventListener('change',function(){
      _applyChange(f,input.value,msg);
    });
    wrap.appendChild(input);
  }
  function _buildSelect(node,f,wrap,rec,msg){
    var sel=document.createElement('select');
    sel.className='ctl';
    rec.input=sel;
    var opts=f.options;
    rec.update=function(n){
      var list;
      if(typeof opts==='function') list=opts(n)||[];
      else list=opts||[];
      var cur=String(_getVal(n,f));
      var found=false;
      sel.innerHTML='';
      list.forEach(function(o){
        var v,lab;
        if(o&&typeof o==='object'){ v=String(o.value); lab=o.label||v; }
        else{ v=String(o); lab=v; }
        if(v===cur) found=true;
        var op=document.createElement('option');
        op.value=v; op.textContent=lab;
        sel.appendChild(op);
      });
      if(cur&&!found){
        var op2=document.createElement('option');
        op2.value=cur; op2.textContent=cur;
        sel.appendChild(op2);
      }
      sel.value=cur;
    };
    rec.update(node);
    sel.addEventListener('change',function(){
      _applyChange(f,sel.value,msg);
    });
    wrap.appendChild(sel);
  }
  function _buildPrompt(node,f,wrap,rec,msg){
    var box=_el('div','prompt-wrap',wrap);
    var pre=_el('pre','prompt-hl',box);
    var code=_el('code','',pre);
    var ta=document.createElement('textarea');
    ta.className='prompt-ta';
    ta.rows=7;
    ta.spellcheck=false;
    ta.value=_getVal(node,f);
    if(f.placeholder) ta.placeholder=f.placeholder;
    box.appendChild(ta);
    rec.input=ta;
    function syncHl(){
      var bad=_danglingSet(ta.value);
      code.innerHTML=_hlHtml(ta.value,bad);
      var names=[];
      bad.forEach(function(v){ names.push(v); });
      if(names.length){
        msg.textContent='悬空变量：'+names.join('、')+' 在当前管线中不存在（不阻断导出）';
        msg.className='field-msg warn';
      }else{
        msg.textContent='';
        msg.className='field-msg';
      }
    }
    rec.update=function(){ syncHl(); };
    ta.addEventListener('input',function(){
      _setSilent(f.key,ta.value);
      syncHl();
      refresh();
    });
    ta.addEventListener('scroll',function(){
      pre.scrollTop=ta.scrollTop;

  function _buildTextarea(node,f,wrap,rec,msg){
    var ta=document.createElement('textarea');
    ta.className='ctl';
    ta.rows=6;
    ta.spellcheck=false;
    ta.value=_getVal(node,f);
    if(f.placeholder) ta.placeholder=f.placeholder;
    rec.input=ta;
    ta.addEventListener('input',function(){
      _setSilent(f.key,ta.value);
      var n=_curNode()||node;
      if(f.validate) _liveCheck(n,f,msg,ta);
      refresh();
    });
    ta.addEventListener('change',function(){
      _applyChange(f,ta.value,msg);
    });
    wrap.appendChild(ta);
  }
  /* ---------- 结构化输出：JSON Schema 编辑器（含校验） ---------- */
  function _hEsc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  var _schemaOpen={};   /* 记住「试校验」框是否展开（refresh 会重建 widget） */
  function _buildSchema(node,f,wrap,rec,msg){
    var box=document.createElement('div'); box.className='schema-box';
    var ta=document.createElement('textarea');
    ta.className='ctl schema-ta'; ta.rows=9; ta.spellcheck=false;
    var cur=_getVal(node,f);
    if(cur&&typeof cur==='object') ta.value=JSON.stringify(cur,null,2);
    else if(typeof cur==='string'&&cur.trim()) ta.value=cur;
    if(f.placeholder) ta.placeholder=f.placeholder;
    /* 不交给框架的通用同步（它会把对象 String() 成 "[object Object]"）——本 widget 自己管 */
    rec.input=null;
    rec.update=function(n){
      var cur2=_getVal(n,f), txt;
      if(cur2&&typeof cur2==='object') txt=JSON.stringify(cur2,null,2);
      else txt=(typeof cur2==='string'?cur2:'');
      if(document.activeElement!==ta && ta.value!==txt) ta.value=txt;
      if(typeof check==='function') check();
    };

    var bar=document.createElement('div'); bar.className='schema-bar';
    function mkBtn(txt,title){ var b=document.createElement('button'); b.type='button'; b.className='schema-btn'; b.textContent=txt; if(title) b.title=title; return b; }
    var bFmt=mkBtn('格式化'), bChk=mkBtn('校验 Schema'), bTest=mkBtn('试校验一段 JSON'), bClr=mkBtn('清空');
    bar.appendChild(bFmt); bar.appendChild(bChk); bar.appendChild(bTest); bar.appendChild(bClr);
    var out=document.createElement('div'); out.className='schema-out'; out.textContent='（空 —— 不启用结构化输出校验）';

    var testBox=document.createElement('div'); testBox.className='schema-test';
    testBox.style.display = _schemaOpen[f.key] ? 'block' : 'none';
    var tt=document.createElement('textarea'); tt.className='ctl schema-ta'; tt.rows=5; tt.spellcheck=false;
    tt.placeholder='贴一段 JSON，用上面的 Schema 校验它，例如：\n{"total": 120.5, "items": ["A","B"]}';
    var bt=mkBtn('对这段 JSON 执行校验');
    testBox.appendChild(tt); testBox.appendChild(bt);

    function parse(){
      var t=String(ta.value||'').trim();
      if(!t) return {empty:true};
      try{ return {obj:JSON.parse(t)}; }
      catch(e){ return {err:'JSON 解析失败：'+String((e&&e.message)||e)}; }
    }
    function structural(o){
      var w=[];
      if(o===null||typeof o!=='object'||Array.isArray(o)) return ['Schema 必须是一个 JSON 对象'];
      if(!o.$ref&&!o.type&&!o.properties&&!o.anyOf&&!o.oneOf&&!o.allOf&&!o.enum&&!o.const)
        w.push('看不到任何类型约束：建议至少给出 type / properties / $ref / anyOf 之一');
      if(o.type&&['object','array','string','number','integer','boolean','null'].indexOf(o.type)<0) w.push('type 取值不是标准 JSON Schema 类型：'+o.type);
      if(o.type==='object'&&o.properties&&typeof o.properties!=='object') w.push('properties 必须是对象');
      if(o.type==='array'&&o.items==null) w.push('array 类型建议给出 items');
      if(o.required&&!Array.isArray(o.required)) w.push('required 必须是字符串数组');
      if(o.properties&&Array.isArray(o.required)){
        var miss=o.required.filter(function(k){ return !(k in o.properties); });
        if(miss.length) w.push('required 里的字段在 properties 中不存在：'+miss.join('、'));
      }
      return w;
    }
    function show(cls,txt){ out.className='schema-out'+(cls?' '+cls:''); out.innerHTML=txt; }
    function check(){
      var r=parse();
      if(r.empty){ show('', '（空 —— 不启用结构化输出校验）'); return null; }
      if(r.err){ show('err', '✗ '+_hEsc(r.err)); return null; }
      var w=structural(r.obj);
      if(w.length) show('warn', '⚠ 是合法 JSON，但结构可疑：<br>· '+w.map(_hEsc).join('<br>· '));
      else show('ok', '✓ 合法 JSON，且结构像 JSON Schema（'+Object.keys(r.obj).length+' 个关键字'+(r.obj.title?('：'+_hEsc(r.obj.title)):'')+'）');
      return r.obj;
    }
    function commit(){
      var r=parse();
      if(r.empty){ _setSilent(f.key,null); return true; }
      if(r.err){ check(); return false; }   /* 非法内容不写库、不刷新 —— 保住用户输入与错误提示 */
      _setSilent(f.key,r.obj);
      var n=_curNode()||node; if(f.validate) _liveCheck(n,f,msg,ta);
      check();
      return true;
    }
    ta.addEventListener('input', function(){ check(); });
    ta.addEventListener('blur', function(){ if(commit()) refresh(); });
    bChk.addEventListener('click', function(){ check(); });
    bFmt.addEventListener('click', function(){
      var r=parse();
      if(r.err){ show('err','✗ '+_hEsc(r.err)); return; }
      if(r.obj==null){ show('','（空）'); return; }
      ta.value=JSON.stringify(r.obj,null,2); commit(); show('ok','✓ 已格式化');
    });
    bClr.addEventListener('click', function(){ ta.value=''; commit(); refresh(); });
    bTest.addEventListener('click', function(){
      var sch=check();
      if(!sch){ return; }
      if(testBox.style.display==='none'){ testBox.style.display='block'; _schemaOpen[f.key]=true; tt.focus(); return; }
      var txt=String(tt.value||'').trim();
      if(!txt){ show('warn','先贴一段 JSON 再校验'); return; }
      var obj;
      try{ obj=JSON.parse(txt); }catch(e){ show('err','✗ 待校验的 JSON 解析失败：'+_hEsc(e.message)); return; }
      var errs=[];
      try{ errs=XTR.validate.validate(obj,sch); }catch(e){ show('err','✗ 校验器异常：'+_hEsc(e.message)); return; }
      if(!errs.length) show('ok','✓ 这段 JSON 通过了 Schema 校验');
      else show('err','✗ 未通过（'+errs.length+' 处）：<br>· '+errs.slice(0,6).map(function(x){ return _hEsc((x.path||'/')+' → '+(x.message||'')); }).join('<br>· ')+(errs.length>6?'<br>… 还有 '+(errs.length-6)+' 处':''));
    });
    bt.addEventListener('click', function(){ tt.value=tt.value; bTest.click(); });

    box.appendChild(ta); box.appendChild(bar); box.appendChild(out); box.appendChild(testBox);
    wrap.appendChild(box);
    check();
  }
  function _buildCheckbox(node,f,wrap,rec,msg){
    var cb=document.createElement('input');
    cb.type='checkbox';
    cb.className='ctl ctl-check';
    cb.checked=!!_getVal(node,f);
    rec.input=cb;
    rec.update=function(n){ cb.checked=!!_getVal(n,f); };
    cb.addEventListener('change',function(){
      _applyChange(f,cb.checked,msg);
    });
    wrap.appendChild(cb);
  }
  /* ---------- fix12：渠道连通测试（GET {base_url}/models） ---------- */
  var _KEY_PREFIX='xtr.apiKey.';
  var _testing=false;
  function _keyStore(id){ try{ return localStorage.getItem(_KEY_PREFIX+id)||''; }catch(e){ return ''; } }
  function _keySave(id,val){
    try{ if(String(val||'').trim()) localStorage.setItem(_KEY_PREFIX+id,String(val).trim()); else localStorage.removeItem(_KEY_PREFIX+id); }catch(e){}
  }
  function _curProvider(n){
    var p=(n&&n.config&&n.config.provider)||{};
    var reg=XTR.providers.get(p.id)||{};
    return { id:p.id||'', label:p.label||reg.label||'未选择渠道',
      channel:p.channel||reg.channel||'',
      base_url:String(p.base_url||reg.base_url||'').trim(),
      api_key_env:p.api_key_env||reg.api_key_env||'' };
  }
  function _buildConnTest(node){
    var box=_el('div','conn-test');
    var head=_el('div','ct-head',box);
    head.textContent='连通测试 · 供应商模型列表';
    var row=_el('div','ct-row',box);
    var keyIn=document.createElement('input');
    keyIn.type='password';
    keyIn.placeholder='粘贴 API Key（仅存本机浏览器）';
    keyIn.setAttribute('autocomplete','off');
    var prov=_curProvider(node);
    keyIn.value=_keyStore(prov.id);
    keyIn.addEventListener('change',function(){ _keySave(prov.id,keyIn.value); });
    var btn=document.createElement('button');
    btn.type='button';
    btn.className='btn';
    btn.textContent='测试连通';
    row.appendChild(keyIn); row.appendChild(btn);
    var msg=_el('div','ct-msg',box);
    msg.textContent='填入该渠道的 API Key 后点击「测试连通」，将实时请求 {base_url}/models 并列出可用模型；密钥只保存在本机浏览器，不会写入导出文件。';
    btn.addEventListener('click',function(){
      _keySave(prov.id,keyIn.value);
      _runConnTest(_curProvider(_curNode()||node),keyIn.value.trim(),btn,msg);
    });
    return box;
  }
  function _runConnTest(p,key,btn,msg){
    if(_testing) return;
    var base=p.base_url.replace(/\/+$/,'');
    if(!base){ msg.className='ct-msg err'; msg.textContent='请先填写接口地址 base_url（选择「自定义渠道」后在上方填写）'; return; }
    if(!key){ msg.className='ct-msg err'; msg.textContent='请先填入 API Key'; return; }
    _testing=true;
    var old=btn.textContent;
    btn.disabled=true; btn.textContent='测试中…';
    msg.className='ct-msg'; msg.textContent='正在请求 '+base+'/models …';
    var headers={};
    if(/anthropic\.com/.test(base)||p.id==='anthropic'){ headers={'x-api-key':key,'anthropic-version':'2023-06-01'}; }
    else { headers={'Authorization':'Bearer '+key}; }
    var ctl=(typeof AbortController!=='undefined')?new AbortController():null;
    var timer=setTimeout(function(){ if(ctl){ try{ ctl.abort(); }catch(e){} } },20000);
    function done(){ clearTimeout(timer); _testing=false; btn.disabled=false; btn.textContent=old; }
    fetch(base+'/models',{method:'GET',headers:headers,signal:ctl?ctl.signal:undefined})
      .then(function(res){
        return res.text().then(function(txt){
          if(!res.ok){ throw { http:res.status, msg:'HTTP '+res.status+(txt?('：'+txt.slice(0,180)):'') }; }
          var list=[];
          try{
            var j=JSON.parse(txt);
            if(Array.isArray(j)) list=j;
            else if(j&&Array.isArray(j.data)) list=j.data;
            else if(j&&Array.isArray(j.models)) list=j.models;
            list=list.map(function(x){ return (x&&typeof x==='object')?(x.id||x.name||x.model||''):String(x); })
                     .filter(function(x){ return !!x; });
            return list;
          }catch(e){ throw { http:res.status, msg:'返回内容不是合法 JSON（该地址可能不是 OpenAI 兼容接口）' }; }
        });
      })
      .then(function(list){
        done();
        if(!list.length){ msg.className='ct-msg err'; msg.textContent='接口可达，但未返回任何模型（data 为空）'; return; }
        msg.className='ct-msg ok';
        msg.textContent='连通成功：共 '+list.length+' 个模型。点击列表中的模型即可填入当前节点。';
        _showModelList(p,list);
      })
      .catch(function(err){
        done();
        msg.className='ct-msg err';
        if(err&&err.http){ msg.textContent=err.msg; }
        else if(err&&err.name==='AbortError'){ msg.textContent='请求超时（20 秒）'; }
        else { msg.textContent='网络请求失败：可能是该渠道未开放浏览器跨域（CORS）直连、接口地址不对或网络不通。部分渠道不允许网页直连，属正常限制。'; }
      });
  }
  function _showModelList(p,list){
    var body=document.createElement('div');
    var info=document.createElement('p');
    info.className='ml-info';
    info.textContent='渠道：'+(p.label||p.id)+'（'+p.base_url+'） 共 '+list.length+' 个模型。点击任意模型将其填入当前「模型调用」节点。';
    body.appendChild(info);
    var search=document.createElement('input');
    search.type='text';
    search.placeholder='筛选模型名…';
    body.appendChild(search);
    var wrap=document.createElement('div');
    wrap.className='model-list';
    body.appendChild(wrap);
    var m=XTR.ui.modal({ title:'供应商模型列表 · '+(p.label||p.id), body:body, width:'560px',
      buttons:[{label:'关闭'}] });
    list.forEach(function(id){
      var it=document.createElement('div');
      it.className='ml-item';
      it.textContent=id;
      it.addEventListener('click',function(){
        _applyChange({key:'model'},id,null);
        XTR.ui.toast('已填入模型：'+id,'success');
        m.close();
      });
      wrap.appendChild(it);
    });
    search.addEventListener('input',function(){
      var q=search.value.trim().toLowerCase();
      Array.prototype.forEach.call(wrap.children,function(el){
        el.style.display=(!q||el.textContent.toLowerCase().indexOf(q)>=0)?'':'none';
      });
    });
  }
  window.XTR.inspector={
    mount:mount,
    show:show,
    hide:hide,
    refresh:refresh
  };
})();

/* ================= 分区 10：UI（工具栏 / 节点面板 / 弹窗 / 状态栏） ================= */
(function(){
  var U=XTR.util;
  var gridOn=true;
  var nameInput=null;

  function _bindToolbar(){
    var b;
    b=_q('btn-new');        if(b) b.addEventListener('click',_newPipeline);
    b=_q('btn-import');     if(b) b.addEventListener('click',function(){ XTR.io.pickFiles(); });

    b=_q('btn-redo');        if(b) b.addEventListener('click',function(){ try{ XTR.graph.redo(); }catch(e){} });

  function _newPipeline(){
    confirm({
      title:'新建管线',
      message:'当前画布内容将被清空（如需保留请先导出）。确定要新建空白管线吗？',
      okLabel:'新建',
      cancelLabel:'取消'
    }).then(function(ok){
      if(!ok) return;
      XTR.graph.setDocs(XTR.model.newPipeline(),XTR.model.newLayout());
      XTR.view.resetViewport();
      XTR.view.setSelection([]);
      XTR.bus.emit('selection:changed',[]);
      toast('已新建空白管线','info');
    });
  }
  /* ---------- 节点面板 ---------- */
  function _bindPalette(){
    var cards=document.querySelectorAll('#palette [data-type]');
    Array.prototype.forEach.call(cards,function(card){
      var type=card.getAttribute('data-type');
      if(!XTR.nodeTypes.get(type)) return;
      var add=card.querySelector('.pal-add')||card.querySelector('button');
      if(add) add.addEventListener('click',function(ev){
        ev.stopPropagation();
        _addNodeAtCenter(type);
      });
      card.setAttribute('draggable','true');
      card.addEventListener('dragstart',function(ev){
        try{
          ev.dataTransfer.setData('text/x-xtr-node',type);
          ev.dataTransfer.setData('text/plain',type);
          ev.dataTransfer.effectAllowed='copy';
        }catch(e){}
      });
    });
    var wrap=_q('canvas-wrap');
    if(!wrap) return;
    wrap.addEventListener('dragover',function(ev){
      var t=ev.dataTransfer&&ev.dataTransfer.types;
      if(t&&(Array.prototype.indexOf.call(t,'text/x-xtr-node')>=0||Array.prototype.indexOf.call(t,'text/plain')>=0)){
        ev.preventDefault();
        ev.dataTransfer.dropEffect='copy';
      }
    });
    wrap.addEventListener('drop',function(ev){
      var type='';
      try{
        type=ev.dataTransfer.getData('text/x-xtr-node')||ev.dataTransfer.getData('text/plain');
      }catch(e){}
      if(!type||!XTR.nodeTypes.get(type)) return;
      ev.preventDefault();
      var r=wrap.getBoundingClientRect();
      var w=XTR.view.screenToWorld(ev.clientX-r.left,ev.clientY-r.top);
      _addNode(type,w.x,w.y);
    });
  }
  function _addNodeAtCenter(type){
    var wrap=_q('canvas-wrap');
    if(!wrap) return;
    var r=wrap.getBoundingClientRect();
    var w=XTR.view.screenToWorld(r.width/2,r.height/2);
    _addNode(type,w.x,w.y);
  }
  function _addNode(type,x,y){
    var sx=Math.round(x/20)*20, sy=Math.round(y/20)*20;
    var r=XTR.graph.addNode(type,sx,sy);
    var id=r&&r.id?r.id:r;
    if(!id){ toast('创建节点失败','danger'); return; }
    XTR.view.setSelection([id]);
    XTR.bus.emit('selection:changed',[id]);
    toast('已添加「'+(XTR.nodeTypes.get(type).label||type)+'」节点','success');
  }
  /* ---------- Toast ---------- */
  function toast(msg,type){
    var root=_q('toast-root');
    if(!root) return;
    var t=document.createElement('div');
    t.className='toast '+(type||'info');
    t.textContent=msg;
    root.appendChild(t);
    setTimeout(function(){
      t.className='toast out '+(type||'info');
      setTimeout(function(){
        if(t.parentNode) t.parentNode.removeChild(t);
      },320);
    },2600);
  }
  /* ---------- 模态 ---------- */
  function modal(opts){
    var root=_q('modal-root');
    if(!root) return {close:function(){},body:null};
    var mask=document.createElement('div');
    mask.className='modal-overlay';
    var box=document.createElement('div');
    box.className='modal';
    if(opts.width) box.style.width=opts.width;
    var head=document.createElement('div');
    head.className='modal-title';
    var title=document.createElement('span');
    title.textContent=opts.title||'';
    head.appendChild(title);
    var closeBtn=document.createElement('button');
    closeBtn.type='button';
    closeBtn.className='modal-x';
    closeBtn.textContent='×';
    if(opts.dismissable===false) closeBtn.style.display='none';
    head.appendChild(closeBtn);
    var body=document.createElement('div');
    body.className='modal-body';
    if(typeof opts.body==='string') body.innerHTML=opts.body;
    else if(opts.body) body.appendChild(opts.body);
    var foot=document.createElement('div');
    foot.className='modal-footer';
    mask.appendChild(box);
    box.appendChild(head);
    box.appendChild(body);
    box.appendChild(foot);
    root.appendChild(mask);
    var closed=false;
    function close(){
      if(closed) return;
      closed=true;
      if(mask.parentNode) mask.parentNode.removeChild(mask);
      if(typeof opts.onClose==='function') opts.onClose();
    }
    closeBtn.addEventListener('click',close);
    if(opts.dismissable!==false){
      mask.addEventListener('click',function(ev){ if(ev.target===mask) close(); });
    }
    (opts.buttons||[]).forEach(function(b){
      var btn=document.createElement('button');
      btn.type='button';
      btn.className='btn '+(b.type||'');
      btn.textContent=b.label;
      btn.addEventListener('click',function(){
        var keep=false;
        if(typeof b.onClick==='function') keep=b.onClick(close);
        if(keep!==true) close();
      });
      foot.appendChild(btn);
    });
    if(!(opts.buttons||[]).length) foot.style.display='none';
    return {close:close,body:body,box:box};
  }
  function confirm(opts){
    return new Promise(function(resolve){
      var settled=false;
      function done(v){ if(settled) return; settled=true; resolve(v); }
      modal({
        title:opts.title||'确认',
        body:opts.message||'',
        dismissable:opts.dismissable!==false,
        onClose:function(){ done(false); },
        buttons:[
          {label:opts.okLabel||'确定',type:opts.danger?'danger':'primary',onClick:function(){ done(true); }},
          {label:opts.cancelLabel||'取消',onClick:function(){ done(false); }}
        ]
      });
    });
  }

    var h2=document.createElement('h4');
    h2.textContent='关于执行';
    body.appendChild(h2);
    var pre=document.createElement('pre');
    pre.className='help-pre';
    pre.textContent=XTR.executor.describe();
    body.appendChild(pre);
    modal({title:'帮助',body:body,buttons:[{label:'知道了',type:'primary'}]});
  }
  /* ---------- 剪贴板（含 file:// 降级） ---------- */
  function copyText(text){
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){
        toast('已复制到剪贴板','success');
      },function(){ _fallbackCopy(text); });
    }else{
      _fallbackCopy(text);
    }
  }
  function _fallbackCopy(text){
    var body=document.createElement('div');
    var p=document.createElement('p');
    p.textContent='当前环境（如 file:// 页面）限制了自动复制，请选中下方文本并按 Ctrl+C 手动复制：';
    body.appendChild(p);
    var ta=document.createElement('textarea');
    ta.className='ctl';
    ta.rows=8;
    ta.style.width='100%';
    ta.value=text;
    body.appendChild(ta);
    modal({title:'复制内容',body:body,buttons:[{label:'关闭'}]});
    setTimeout(function(){ ta.focus(); ta.select(); },60);
