<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>流谱 · FlowScore —— 开箱即用 AI 工作流精选</title>
<link rel="icon" href="data:,">
<style>*{box-sizing:border-box;margin:0;padding:0}
:root{
  --paper:#faf8f3; --ink:#1c1a16; --ink-2:#4a453d; --ink-3:#8a8377;
  --rule:#e2ddd2; --card:#ffffff; --accent:#a63a2a; --accent-soft:#f3e7e3;
  --green:#3f7a4d; --amber:#a8761f; --gray:#9a938a;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"Noto Sans SC","Source Han Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif;
  --mono:"JetBrains Mono","SF Mono","Menlo","Consolas",monospace;
}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;padding-left:190px}
a{color:inherit;text-decoration:none}

#top{position:sticky;top:0;z-index:100;background:rgba(250,248,243,.93);backdrop-filter:blur(12px);border-bottom:1px solid var(--rule)}
#top-in{max-width:1400px;margin:0 auto;padding:18px 28px 14px}
#brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:14px}
#brand h1{font-family:var(--serif);font-size:23px;font-weight:700;letter-spacing:.5px}
#brand .sub{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:1.5px}
#brand .stats{margin-left:auto;display:flex;gap:18px;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
#brand .stats b{color:var(--accent);font-weight:600}
#controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#q{flex:1;min-width:220px;padding:9px 14px;font-size:13.5px;font-family:var(--sans);border:1px solid var(--rule);border-radius:3px;background:var(--card);color:var(--ink);outline:none}
#q:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
select{padding:9px 12px;font-size:13px;font-family:var(--sans);border:1px solid var(--rule);border-radius:3px;background:var(--card);color:var(--ink);outline:none;cursor:pointer}
select:focus{border-color:var(--accent)}
.ai-btn{padding:9px 13px;font-size:13px;font-family:var(--sans);border:1px solid var(--rule);border-radius:3px;background:var(--card);color:var(--ink-2);cursor:pointer;transition:.15s;white-space:nowrap}
.ai-btn:hover{border-color:var(--accent);color:var(--accent)}
.ai-btn[disabled]{opacity:.55;cursor:wait}
#top-toggle{display:none;align-items:center;gap:8px;width:100%;padding:9px 12px;background:var(--card);border:1px solid var(--rule);border-radius:4px;font-size:13.5px;font-family:var(--sans);color:var(--ink-2);cursor:pointer;transition:.15s}
#top-toggle:hover{border-color:var(--accent);color:var(--accent)}
#top-toggle .arr{margin-left:auto;color:var(--ink-3);font-size:11px;transition:transform .18s}
.cat{font-size:12.5px;padding:4px 11px;border:1px solid var(--rule);border-radius:100px;background:transparent;color:var(--ink-2);cursor:pointer;transition:.16s;font-family:var(--sans)}
.cat:hover{border-color:var(--ink-3);color:var(--ink)}
.cat.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.cat .cnt{font-family:var(--mono);font-size:10.5px;opacity:.6;margin-left:4px}
.cat.off0{opacity:.42}
.cat.clr{border-style:dashed;color:var(--ink-3)}

/* ── 可展开的分类（分面） ── */
#facets{margin-top:10px;border-top:1px solid var(--rule)}
.fg{border-bottom:1px solid var(--rule)}
.fg-head{display:flex;align-items:center;gap:8px;width:100%;padding:8px 2px;background:none;border:0;cursor:pointer;font-size:13px;color:var(--ink-2);font-family:var(--sans);text-align:left}
.fg-head:hover{color:var(--ink)}
.fg-head .sel{color:var(--accent);font-family:var(--mono);font-size:10.5px}
.fg-head .arrow{margin-left:auto;color:var(--ink-3);font-size:10px;transition:transform .18s}
.fg.open .arrow{transform:rotate(180deg)}
.fg-body{display:none;flex-wrap:wrap;gap:6px;padding:2px 0 11px}
.fg.open .fg-body{display:flex}
.fg-body .cat{margin:0}

#wrap{max-width:1400px;margin:0 auto;padding:22px 28px 80px}
#meta{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-bottom:14px}
#meta a{color:var(--accent)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:4px;padding:15px 16px 13px;display:flex;flex-direction:column;gap:9px;transition:.18s;position:relative;overflow:hidden}
.card:hover{border-color:var(--ink-3);box-shadow:0 2px 12px rgba(28,26,22,.07);transform:translateY(-1px)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;transition:.18s}
.card[data-k="high"]::before{background:var(--green)}
.card[data-k="medium"]::before{background:var(--amber)}
.card[data-k="low"]::before{background:var(--gray)}
.c-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.c-name{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--ink);word-break:break-all;line-height:1.35}
.c-name span{color:var(--ink-3);font-weight:400}
.c-type{font-size:10.5px;padding:2px 8px;background:var(--accent-soft);color:var(--accent);border-radius:2px;white-space:nowrap}
.c-sub{font-size:10.5px;padding:2px 8px;background:#eef4ef;color:var(--green);border-radius:2px;white-space:nowrap}
.c-desc{font-size:13.2px;color:var(--ink);line-height:1.62;text-wrap:pretty}
.c-en{font-size:11.5px;color:var(--ink-3);line-height:1.5;font-style:italic;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-tags{display:flex;gap:5px;flex-wrap:wrap}
.c-tags span{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:2px;border:1px solid var(--rule);color:var(--ink-3)}
.c-tags span.d{border-color:#e9d6d0;color:var(--accent);background:#fdf8f5}
.c-tags span.f{border-color:#d9cfc4;color:var(--ink-2);background:#faf7f2}
.c-foot{margin-top:auto;padding-top:9px;border-top:1px solid var(--rule);display:flex;align-items:center;gap:11px;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.c-star{color:var(--accent);font-weight:600}
.c-conf{padding:1px 6px;border-radius:2px;font-size:10px}
.c-conf[data-k="high"]{background:#e8f2ea;color:var(--green)}
.c-conf[data-k="medium"]{background:#faf1de;color:var(--amber)}
.c-conf[data-k="low"]{background:#f0eeea;color:var(--gray)}
.c-go{margin-left:auto;color:var(--accent);font-weight:600;font-size:11.5px;transition:.15s;white-space:nowrap}
.card:hover .c-go{letter-spacing:.4px}
#more{text-align:center;padding:30px 0;font-family:var(--mono);font-size:12px;color:var(--ink-3)}
#sentinel{height:1px}
.empty{text-align:center;padding:80px 20px;color:var(--ink-3);font-family:var(--mono);font-size:13px}
.empty a{color:var(--accent);border-bottom:1px solid var(--accent-soft)}
/* 骨架屏（首屏加载观感） */
.skel{background:var(--card);border:1px solid var(--rule);border-radius:4px;height:152px;position:relative;overflow:hidden}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(28,26,22,.04),transparent);animation:sk 1.3s ease-in-out infinite}
@keyframes sk{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

#hot-sec{margin-bottom:22px}
.hot-label{font-family:var(--mono);font-size:10.5px;letter-spacing:2px;color:var(--accent);margin-bottom:9px;font-weight:600}
.hot-card{display:block;background:linear-gradient(135deg,#fdf8f5 0%,#faf2ee 100%);border:1px solid #e9d6d0;border-left:4px solid var(--accent);border-radius:5px;padding:17px 20px 16px;transition:.2s}
.hot-card:hover{border-color:var(--accent);box-shadow:0 3px 18px rgba(166,58,42,.13);transform:translateY(-1px)}
.hot-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:9px}
.hot-name{font-family:var(--mono);font-size:14.5px;font-weight:700;color:var(--ink);word-break:break-all}
.hot-name span{color:var(--ink-3);font-weight:400}
.hot-go{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--accent);font-weight:600;white-space:nowrap}
.hot-desc{font-size:13.6px;color:var(--ink-2);line-height:1.72;margin-bottom:12px}
.hot-tags{display:flex;gap:7px;flex-wrap:wrap}
.hot-tags span{font-size:11px;padding:3px 9px;background:#fff;border:1px solid #e9d6d0;color:var(--accent);border-radius:2px;white-space:nowrap}
footer{max-width:1400px;margin:0 auto;padding:26px 28px 40px;border-top:1px solid var(--rule);font-family:var(--mono);font-size:11px;color:var(--ink-3);display:flex;gap:16px;flex-wrap:wrap}

/* ── 侧边栏 ── */
#side{position:fixed;left:0;top:0;bottom:0;width:190px;z-index:110;background:var(--paper);border-right:1px solid var(--rule);padding:20px 16px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.gen-btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;
  background:var(--accent);color:#fff;border-radius:3px;font-size:13.5px;font-weight:600;
  white-space:nowrap;flex-shrink:0;transition:.18s;
  box-shadow:0 2px 8px rgba(166,58,42,.22);letter-spacing:.5px}
.gen-btn:hover{background:#8f3226;transform:translateY(-1px);box-shadow:0 4px 14px rgba(166,58,42,.32)}
.gen-btn:active{transform:translateY(0)}
#side-toggle{align-self:flex-end;width:32px;height:26px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--rule);border-radius:4px;cursor:pointer;color:var(--ink-3);font-size:14px;line-height:1;transition:.15s;flex-shrink:0;font-family:var(--mono);padding:0}
#side-toggle:hover{border-color:var(--ink-3);color:var(--ink)}
body.side-collapsed{padding-left:54px}
body.side-collapsed #side{width:54px;padding:20px 8px}
body.side-collapsed .lbl{display:none}
body.side-collapsed #side-toggle{align-self:center}
body.side-collapsed .gen-btn,body.side-collapsed .side-link{justify-content:center;padding-left:6px;padding-right:6px}
.side-sep{height:1px;background:var(--rule);margin:4px 0}
.side-nav{display:flex;flex-direction:column;gap:2px}
.side-link{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:4px;font-size:13.5px;color:var(--ink-2);transition:.15s}
.side-link:hover{background:var(--accent-soft);color:var(--ink)}
.side-link.on{background:var(--accent-soft);color:var(--accent);font-weight:600}

@media(max-width:640px){#top-in,#wrap{padding-left:16px;padding-right:16px}#brand .stats{display:none}#grid{grid-template-columns:1fr}.gen-btn{padding:8px 13px;font-size:12.5px}}
@media(max-width:820px){
  body{padding-left:0}#side-toggle{display:none}
  #side{position:static;width:auto;height:auto;bottom:auto;border-right:0;border-bottom:1px solid var(--rule);padding:10px 16px;gap:8px;flex-direction:row;flex-wrap:wrap;align-items:center}
  #side .gen-btn{width:auto}
  .side-sep{display:none}
  .side-nav{flex-direction:row;flex-wrap:wrap}
  body.side-collapsed{padding-left:0}
  body.side-collapsed #side{width:auto;padding:10px 16px}
  body.side-collapsed .lbl{display:inline}
  /* 顶部搜索区：手机端可折叠（默认收起，localStorage 记忆 fs_top） */
  #top-toggle{display:flex}
  body.top-collapsed #top-in{padding:10px 16px 12px}
  body.top-collapsed #brand,body.top-collapsed #controls,body.top-collapsed #facets{display:none}
  body:not(.top-collapsed) #top-toggle .arr{transform:rotate(180deg)}
}
#more.loading{animation:rpulse 1.1s ease-in-out infinite}
@keyframes rpulse{50%{opacity:.4}}

/* ── 管线库（新增） ── */
.pcard-tags{display:flex;flex-wrap:wrap;gap:5px}
.pcard-tags span{font-size:10.5px;padding:2px 8px;background:#eef2f8;color:var(--ink-2);border-radius:2px}
.pcard-note{font-size:11.5px;color:var(--ink-3);font-style:italic}
.node{border:1px solid var(--rule);border-radius:4px;background:var(--card);margin-bottom:10px}
.node-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:9px 13px;
  border-bottom:1px solid var(--rule);background:rgba(0,0,0,.018)}
.node-seq{font-family:var(--mono);font-size:11px;background:var(--ink);color:var(--paper);
  padding:1px 7px;min-width:24px;text-align:center;border-radius:2px}
.node-ty{font-family:var(--mono);font-size:10.5px;padding:1px 6px;border:1px solid var(--rule);
  border-radius:2px;color:var(--ink-3)}
.node-ty.model_call{color:var(--green);border-color:var(--green)}
.node-ty.note{color:#6b4a8c;border-color:#6b4a8c}
.node-lb{font-weight:600;color:var(--ink)}
.node-body{padding:10px 13px;font-size:13.2px;line-height:1.65}
.node-note{margin-top:8px;padding:7px 10px;background:rgba(0,0,0,.022);
  border-left:3px solid var(--rule);font-size:12.3px;color:var(--ink-3)}
.port{font-family:var(--mono);font-size:11.5px;display:flex;gap:7px;flex-wrap:wrap;
  align-items:flex-start;padding:5px 8px;margin-top:5px;border:1px solid var(--rule);border-radius:2px}
.port .pn{color:#3a5a8c;font-weight:600}
.port .req{color:var(--accent)}
.port .opt{color:var(--ink-3)}
.port .inj{color:#b3562e;font-weight:600}
.port .mdm{color:#6b4a8c}
.doc-box{border:1px solid var(--rule);border-radius:4px;background:var(--card);padding:20px 24px;
  font-size:13.8px;line-height:1.78}
.doc-box h2{font-size:17px;margin:20px 0 9px;padding-bottom:6px;border-bottom:1px solid var(--rule);color:var(--ink)}
.doc-box h2:first-child{margin-top:0}
.doc-box h3{font-size:14.5px;margin:15px 0 7px;color:var(--ink)}
.doc-box p{margin-bottom:10px}
.doc-box ul,.doc-box ol{margin:0 0 11px 1.3em}
.doc-box li{margin-bottom:4px}
.doc-box pre{font-family:var(--mono);font-size:12px;background:rgba(0,0,0,.03);
  border:1px solid var(--rule);border-radius:3px;padding:11px 13px;overflow-x:auto;margin:11px 0;white-space:pre}
.doc-box table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px}
.doc-box th{text-align:left;font-size:11.5px;font-family:var(--mono);background:rgba(0,0,0,.03);
  padding:7px 10px;border-bottom:1px solid var(--rule)}
.doc-box td{padding:7px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
.doc-box blockquote{border-left:3px solid var(--accent);background:var(--accent-soft);
  padding:8px 13px;margin:11px 0}
.doc-box hr{border:0;border-top:1px solid var(--rule);margin:16px 0}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--rule);margin:22px 0 18px}
.tabs button{font-size:13.5px;padding:9px 17px;cursor:pointer;border:0;background:none;
  color:var(--ink-3);border-bottom:2px solid transparent;font-family:var(--sans)}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.pnote{border:1px solid var(--rule);border-left:4px solid var(--accent);background:var(--accent-soft);
  border-radius:3px;padding:12px 16px;margin:16px 0;font-size:13.3px}
.pnote .ct{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;color:var(--accent);margin-bottom:4px}
</style>
</head>

<script>
(function(){
  var reg=null, cur='全部', q='';
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  var grid=document.getElementById('grid');

  function card(p){
    var s=p.stats||{};
    var chips=[];
    (p.tags||[]).slice(0,3).forEach(function(t){chips.push('<span>'+esc(t)+'</span>');});
    return '<article class="card" data-k="'+(p.featured?'high':'medium')+'">'
      + '<div class="c-head">'
      +   '<div class="c-name">'+esc(p.name)+'</div>'
      +   (p.category?'<span class="c-type">'+esc(p.category)+'</span>':'')
      +   (p.featured?'<span class="c-sub">推荐</span>':'')
      + '</div>'
      + '<div class="c-desc">'+esc(p.summary)+'</div>'
      + (chips.length?'<div class="pcard-tags">'+chips.join('')+'</div>':'')
      + '<div class="c-foot">'
      +   '<span class="c-star">'+(s.nodes||0)+' 节点 · '+(s.edges||0)+' 连线'
      +     (s.models?' · '+s.models+' 模型':'')+(s.notes?' · '+s.notes+' 注释':'')+'</span>'
      +   '<span class="c-conf" data-k="'+(p.featured?'high':'medium')+'">v'+esc(p.version)+'</span>'
      +   '<a class="c-go" href="pipeline.html?id='+encodeURIComponent(p.id)+'">查看详情</a>'
      +   '<a class="c-go" target="_blank" rel="noopener" href="orchestrator/?open='
      +      encodeURIComponent('/library/pipelines/'+p.id+'/pipeline.flow.json')+'">生成器 ↗</a>'
      + '</div></article>';
  }

  function render(){
    if(!reg) return;
    var list=(reg.pipelines||[]).filter(function(p){
      if(cur!=='全部'&&p.category!==cur) return false;
      if(!q) return true;
      var hay=(p.name+' '+p.summary+' '+(p.tags||[]).join(' ')+' '+p.category).toLowerCase();
      return hay.indexOf(q.toLowerCase())>=0;
    });
    var so=document.getElementById('sort').value;
    list.sort(function(a,b){
      if(so==='name') return a.name.localeCompare(b.name,'zh');
      if(so==='nodes') return (b.stats.nodes)-(a.stats.nodes);
      return (a.featured?0:1)-(b.featured?0:1) || a.order-b.order;
    });
    document.getElementById('stats').innerHTML=
      '<span><b>'+reg.count+'</b> 条管线</span>'
      +'<span><b>'+(reg.categories||[]).length+'</b> 个分类</span>'
      +'<span>共 <b>'+list.length+'</b> 条命中</span>';
    grid.innerHTML = list.length
      ? list.map(card).join('')
      : '<div class="empty">没有匹配的管线 · 换个关键词或分类试试</div>';
  }

  function facets(){
    var f=document.getElementById('facets');
    var html='<div class="fg open"><button class="fg-head" type="button">分类'
      +'<span class="sel">'+(cur==='全部'?'全部':esc(cur))+'</span><span class="arrow">▾</span></button>'
      +'<div class="fg-body"><button class="cat'+(cur==='全部'?' on':'')+'" data-c="全部">全部'
      +'<span class="cnt">'+reg.count+'</span></button>';
    (reg.categories||[]).forEach(function(c){
      html+='<button class="cat'+(cur===c.name?' on':'')+'" data-c="'+esc(c.name)+'">'+esc(c.name)
        +'<span class="cnt">'+c.count+'</span></button>';
    });
    html+='</div></div>';
    f.innerHTML=html;
    f.querySelector('.fg-head').addEventListener('click',function(){
      this.parentNode.classList.toggle('open');});
    [].forEach.call(f.querySelectorAll('.cat'),function(b){
      b.addEventListener('click',function(){cur=b.dataset.c;facets();render();});});
  }

  fetch('registry.json',{cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status); return r.json();
  }).then(function(j){
    reg=j; facets(); render();
    var fb=document.getElementById('f-built'); if(fb) fb.textContent='更新 '+(j.generated||'').slice(0,16).replace('T',' ');
    if(j.skipped&&j.skipped.length) console.warn('未收录：',j.skipped);
  }).catch(function(e){
    grid.innerHTML='<div class="empty">读不到 <code>registry.json</code>：'+esc(e.message)+'</div>';
  });

  document.getElementById('q').addEventListener('input',function(){q=this.value.trim();render();});
  document.getElementById('sort').addEventListener('change',render);
})();
</script>
</body>
</html>
