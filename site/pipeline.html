<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>流谱 · FlowScore —— 开箱即用 AI 工作流精选</title>
<link rel="icon" href="data:,">
<style>*{box-sizing:border-box;margin:0;padding:0}
:root{
  --paper:#faf8f3; --ink:#1c1a16; --ink-2:#4a453d; --ink-3:#8a8377;
  --rule:#e2ddd2; --card:#ffffff; --accent:#a63a2a; --accent-soft:#f3e7e3;
  --green:#3f7a4d; --amber:#a8761f; --gray:#9a938a;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"Noto Sans SC","Source Han Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif;
  --mono:"JetBrains Mono","SF Mono","Menlo","Consolas",monospace;
}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;padding-left:190px}
a{color:inherit;text-decoration:none}

#top{position:sticky;top:0;z-index:100;background:rgba(250,248,243,.93);backdrop-filter:blur(12px);border-bottom:1px solid var(--rule)}
#top-in{max-width:1400px;margin:0 auto;padding:18px 28px 14px}
#brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:14px}
#brand h1{font-family:var(--serif);font-size:23px;font-weight:700;letter-spacing:.5px}
#brand .sub{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:1.5px}
#brand .stats{margin-left:auto;display:flex;gap:18px;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
#brand .stats b{color:var(--accent);font-weight:600}
#controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#q{flex:1;min-width:220px;padding:9px 14px;font-size:13.5px;font-family:var(--sans);border:1px solid var(--rule);border-radius:3px;background:var(--card);color:var(--ink);outline:none}
#q:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
select{padding:9px 12px;font-size:13px;font-family:var(--sans);border:1px solid var(--rule);border-radius:3px;background:var(--card);color:var(--ink);outline:none;cursor:pointer}
select:focus{border-color:var(--accent)}
.ai-btn{padding:9px 13px;font-size:13px;font-family:var(--sans);border:1px solid var(--rule);border-radius:3px;background:var(--card);color:var(--ink-2);cursor:pointer;transition:.15s;white-space:nowrap}
.ai-btn:hover{border-color:var(--accent);color:var(--accent)}
.ai-btn[disabled]{opacity:.55;cursor:wait}
#top-toggle{display:none;align-items:center;gap:8px;width:100%;padding:9px 12px;background:var(--card);border:1px solid var(--rule);border-radius:4px;font-size:13.5px;font-family:var(--sans);color:var(--ink-2);cursor:pointer;transition:.15s}
#top-toggle:hover{border-color:var(--accent);color:var(--accent)}
#top-toggle .arr{margin-left:auto;color:var(--ink-3);font-size:11px;transition:transform .18s}
.cat{font-size:12.5px;padding:4px 11px;border:1px solid var(--rule);border-radius:100px;background:transparent;color:var(--ink-2);cursor:pointer;transition:.16s;font-family:var(--sans)}
.cat:hover{border-color:var(--ink-3);color:var(--ink)}
.cat.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.cat .cnt{font-family:var(--mono);font-size:10.5px;opacity:.6;margin-left:4px}
.cat.off0{opacity:.42}
.cat.clr{border-style:dashed;color:var(--ink-3)}

/* ── 可展开的分类（分面） ── */
#facets{margin-top:10px;border-top:1px solid var(--rule)}
.fg{border-bottom:1px solid var(--rule)}
.fg-head{display:flex;align-items:center;gap:8px;width:100%;padding:8px 2px;background:none;border:0;cursor:pointer;font-size:13px;color:var(--ink-2);font-family:var(--sans);text-align:left}
.fg-head:hover{color:var(--ink)}
.fg-head .sel{color:var(--accent);font-family:var(--mono);font-size:10.5px}
.fg-head .arrow{margin-left:auto;color:var(--ink-3);font-size:10px;transition:transform .18s}
.fg.open .arrow{transform:rotate(180deg)}
.fg-body{display:none;flex-wrap:wrap;gap:6px;padding:2px 0 11px}
.fg.open .fg-body{display:flex}
.fg-body .cat{margin:0}

#wrap{max-width:1400px;margin:0 auto;padding:22px 28px 80px}
#meta{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-bottom:14px}
#meta a{color:var(--accent)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:4px;padding:15px 16px 13px;display:flex;flex-direction:column;gap:9px;transition:.18s;position:relative;overflow:hidden}
.card:hover{border-color:var(--ink-3);box-shadow:0 2px 12px rgba(28,26,22,.07);transform:translateY(-1px)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;transition:.18s}
.card[data-k="high"]::before{background:var(--green)}
.card[data-k="medium"]::before{background:var(--amber)}
.card[data-k="low"]::before{background:var(--gray)}
.c-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.c-name{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--ink);word-break:break-all;line-height:1.35}
.c-name span{color:var(--ink-3);font-weight:400}
.c-type{font-size:10.5px;padding:2px 8px;background:var(--accent-soft);color:var(--accent);border-radius:2px;white-space:nowrap}
.c-sub{font-size:10.5px;padding:2px 8px;background:#eef4ef;color:var(--green);border-radius:2px;white-space:nowrap}
.c-desc{font-size:13.2px;color:var(--ink);line-height:1.62;text-wrap:pretty}
.c-en{font-size:11.5px;color:var(--ink-3);line-height:1.5;font-style:italic;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-tags{display:flex;gap:5px;flex-wrap:wrap}
.c-tags span{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:2px;border:1px solid var(--rule);color:var(--ink-3)}
.c-tags span.d{border-color:#e9d6d0;color:var(--accent);background:#fdf8f5}
.c-tags span.f{border-color:#d9cfc4;color:var(--ink-2);background:#faf7f2}
.c-foot{margin-top:auto;padding-top:9px;border-top:1px solid var(--rule);display:flex;align-items:center;gap:11px;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.c-star{color:var(--accent);font-weight:600}
.c-conf{padding:1px 6px;border-radius:2px;font-size:10px}
.c-conf[data-k="high"]{background:#e8f2ea;color:var(--green)}
.c-conf[data-k="medium"]{background:#faf1de;color:var(--amber)}
.c-conf[data-k="low"]{background:#f0eeea;color:var(--gray)}
.c-go{margin-left:auto;color:var(--accent);font-weight:600;font-size:11.5px;transition:.15s;white-space:nowrap}
.card:hover .c-go{letter-spacing:.4px}
#more{text-align:center;padding:30px 0;font-family:var(--mono);font-size:12px;color:var(--ink-3)}
#sentinel{height:1px}
.empty{text-align:center;padding:80px 20px;color:var(--ink-3);font-family:var(--mono);font-size:13px}
.empty a{color:var(--accent);border-bottom:1px solid var(--accent-soft)}
/* 骨架屏（首屏加载观感） */
.skel{background:var(--card);border:1px solid var(--rule);border-radius:4px;height:152px;position:relative;overflow:hidden}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(28,26,22,.04),transparent);animation:sk 1.3s ease-in-out infinite}
@keyframes sk{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

#hot-sec{margin-bottom:22px}
.hot-label{font-family:var(--mono);font-size:10.5px;letter-spacing:2px;color:var(--accent);margin-bottom:9px;font-weight:600}
.hot-card{display:block;background:linear-gradient(135deg,#fdf8f5 0%,#faf2ee 100%);border:1px solid #e9d6d0;border-left:4px solid var(--accent);border-radius:5px;padding:17px 20px 16px;transition:.2s}
.hot-card:hover{border-color:var(--accent);box-shadow:0 3px 18px rgba(166,58,42,.13);transform:translateY(-1px)}
.hot-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:9px}
.hot-name{font-family:var(--mono);font-size:14.5px;font-weight:700;color:var(--ink);word-break:break-all}
.hot-name span{color:var(--ink-3);font-weight:400}
.hot-go{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--accent);font-weight:600;white-space:nowrap}
.hot-desc{font-size:13.6px;color:var(--ink-2);line-height:1.72;margin-bottom:12px}
.hot-tags{display:flex;gap:7px;flex-wrap:wrap}
.hot-tags span{font-size:11px;padding:3px 9px;background:#fff;border:1px solid #e9d6d0;color:var(--accent);border-radius:2px;white-space:nowrap}
footer{max-width:1400px;margin:0 auto;padding:26px 28px 40px;border-top:1px solid var(--rule);font-family:var(--mono);font-size:11px;color:var(--ink-3);display:flex;gap:16px;flex-wrap:wrap}

/* ── 侧边栏 ── */
#side{position:fixed;left:0;top:0;bottom:0;width:190px;z-index:110;background:var(--paper);border-right:1px solid var(--rule);padding:20px 16px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.gen-btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;
  background:var(--accent);color:#fff;border-radius:3px;font-size:13.5px;font-weight:600;
  white-space:nowrap;flex-shrink:0;transition:.18s;
  box-shadow:0 2px 8px rgba(166,58,42,.22);letter-spacing:.5px}
.gen-btn:hover{background:#8f3226;transform:translateY(-1px);box-shadow:0 4px 14px rgba(166,58,42,.32)}
.gen-btn:active{transform:translateY(0)}
#side-toggle{align-self:flex-end;width:32px;height:26px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--rule);border-radius:4px;cursor:pointer;color:var(--ink-3);font-size:14px;line-height:1;transition:.15s;flex-shrink:0;font-family:var(--mono);padding:0}
#side-toggle:hover{border-color:var(--ink-3);color:var(--ink)}
body.side-collapsed{padding-left:54px}
body.side-collapsed #side{width:54px;padding:20px 8px}
body.side-collapsed .lbl{display:none}
body.side-collapsed #side-toggle{align-self:center}
body.side-collapsed .gen-btn,body.side-collapsed .side-link{justify-content:center;padding-left:6px;padding-right:6px}
.side-sep{height:1px;background:var(--rule);margin:4px 0}
.side-nav{display:flex;flex-direction:column;gap:2px}
.side-link{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:4px;font-size:13.5px;color:var(--ink-2);transition:.15s}
.side-link:hover{background:var(--accent-soft);color:var(--ink)}
.side-link.on{background:var(--accent-soft);color:var(--accent);font-weight:600}

@media(max-width:640px){#top-in,#wrap{padding-left:16px;padding-right:16px}#brand .stats{display:none}#grid{grid-template-columns:1fr}.gen-btn{padding:8px 13px;font-size:12.5px}}
@media(max-width:820px){
  body{padding-left:0}#side-toggle{display:none}
  #side{position:static;width:auto;height:auto;bottom:auto;border-right:0;border-bottom:1px solid var(--rule);padding:10px 16px;gap:8px;flex-direction:row;flex-wrap:wrap;align-items:center}
  #side .gen-btn{width:auto}
  .side-sep{display:none}
  .side-nav{flex-direction:row;flex-wrap:wrap}
  body.side-collapsed{padding-left:0}
  body.side-collapsed #side{width:auto;padding:10px 16px}
  body.side-collapsed .lbl{display:inline}
  /* 顶部搜索区：手机端可折叠（默认收起，localStorage 记忆 fs_top） */
  #top-toggle{display:flex}
  body.top-collapsed #top-in{padding:10px 16px 12px}
  body.top-collapsed #brand,body.top-collapsed #controls,body.top-collapsed #facets{display:none}
  body:not(.top-collapsed) #top-toggle .arr{transform:rotate(180deg)}
}
#more.loading{animation:rpulse 1.1s ease-in-out infinite}
@keyframes rpulse{50%{opacity:.4}}

/* ── 管线库（新增） ── */
.pcard-tags{display:flex;flex-wrap:wrap;gap:5px}
.pcard-tags span{font-size:10.5px;padding:2px 8px;background:#eef2f8;color:var(--ink-2);border-radius:2px}
.pcard-note{font-size:11.5px;color:var(--ink-3);font-style:italic}
.node{border:1px solid var(--rule);border-radius:4px;background:var(--card);margin-bottom:10px}
.node-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:9px 13px;
  border-bottom:1px solid var(--rule);background:rgba(0,0,0,.018)}
.node-seq{font-family:var(--mono);font-size:11px;background:var(--ink);color:var(--paper);
  padding:1px 7px;min-width:24px;text-align:center;border-radius:2px}
.node-ty{font-family:var(--mono);font-size:10.5px;padding:1px 6px;border:1px solid var(--rule);
  border-radius:2px;color:var(--ink-3)}
.node-ty.model_call{color:var(--green);border-color:var(--green)}
.node-ty.note{color:#6b4a8c;border-color:#6b4a8c}
.node-lb{font-weight:600;color:var(--ink)}
.node-body{padding:10px 13px;font-size:13.2px;line-height:1.65}
.node-note{margin-top:8px;padding:7px 10px;background:rgba(0,0,0,.022);
  border-left:3px solid var(--rule);font-size:12.3px;color:var(--ink-3)}
.port{font-family:var(--mono);font-size:11.5px;display:flex;gap:7px;flex-wrap:wrap;
  align-items:flex-start;padding:5px 8px;margin-top:5px;border:1px solid var(--rule);border-radius:2px}
.port .pn{color:#3a5a8c;font-weight:600}
.port .req{color:var(--accent)}
.port .opt{color:var(--ink-3)}
.port .inj{color:#b3562e;font-weight:600}
.port .mdm{color:#6b4a8c}
.doc-box{border:1px solid var(--rule);border-radius:4px;background:var(--card);padding:20px 24px;
  font-size:13.8px;line-height:1.78}
.doc-box h2{font-size:17px;margin:20px 0 9px;padding-bottom:6px;border-bottom:1px solid var(--rule);color:var(--ink)}
.doc-box h2:first-child{margin-top:0}
.doc-box h3{font-size:14.5px;margin:15px 0 7px;color:var(--ink)}
.doc-box p{margin-bottom:10px}
.doc-box ul,.doc-box ol{margin:0 0 11px 1.3em}
.doc-box li{margin-bottom:4px}
.doc-box pre{font-family:var(--mono);font-size:12px;background:rgba(0,0,0,.03);
  border:1px solid var(--rule);border-radius:3px;padding:11px 13px;overflow-x:auto;margin:11px 0;white-space:pre}
.doc-box table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px}
.doc-box th{text-align:left;font-size:11.5px;font-family:var(--mono);background:rgba(0,0,0,.03);
  padding:7px 10px;border-bottom:1px solid var(--rule)}
.doc-box td{padding:7px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
.doc-box blockquote{border-left:3px solid var(--accent);background:var(--accent-soft);
  padding:8px 13px;margin:11px 0}
.doc-box hr{border:0;border-top:1px solid var(--rule);margin:16px 0}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--rule);margin:22px 0 18px}
.tabs button{font-size:13.5px;padding:9px 17px;cursor:pointer;border:0;background:none;
  color:var(--ink-3);border-bottom:2px solid transparent;font-family:var(--sans)}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.pnote{border:1px solid var(--rule);border-left:4px solid var(--accent);background:var(--accent-soft);
  border-radius:3px;padding:12px 16px;margin:16px 0;font-size:13.3px}
.pnote .ct{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;color:var(--accent);margin-bottom:4px}
</style>
</head>

<script>
(function(){
  var ID=new URLSearchParams(location.search).get('id')||'';
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function md(src){
    var L=String(src).split('\n'),out=[],i=0,inUl=false,inOl=false,inPre=false,pre=[];
    function cl(){if(inUl){out.push('</ul>');inUl=false;}if(inOl){out.push('</ol>');inOl=false;}}
    function inl(t){t=esc(t);t=t.replace(/`([^`]+)`/g,'<code>$1</code>');
      t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
      t=t.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>');return t;}
    for(;i<L.length;i++){var l=L[i];
      if(/^```/.test(l)){if(inPre){out.push('<pre>'+esc(pre.join('\n'))+'</pre>');pre=[];inPre=false;}
        else{cl();inPre=true;}continue;}
      if(inPre){pre.push(l);continue;}
      if(/^\s*$/.test(l)){cl();continue;}
      if(/^---+$/.test(l)){cl();out.push('<hr>');continue;}
      var h=l.match(/^(#{1,4})\s+(.*)$/);
      if(h){cl();var n=Math.min(h[1].length+1,4);out.push('<h'+n+'>'+inl(h[2])+'</h'+n+'>');continue;}
      if(/^>\s?/.test(l)){cl();out.push('<blockquote>'+inl(l.replace(/^>\s?/,''))+'</blockquote>');continue;}
      if(/^\s*\|.*\|\s*$/.test(l)){cl();var rows=[];
        while(i<L.length&&/^\s*\|.*\|\s*$/.test(L[i])){rows.push(L[i]);i++;}i--;
        if(rows.length>=2&&/^[\s|:-]+$/.test(rows[1])){
          var hd=rows[0].split('|').slice(1,-1),bd=rows.slice(2);
          out.push('<table><thead><tr>'+hd.map(function(c){return '<th>'+inl(c.trim())+'</th>';}).join('')
            +'</tr></thead><tbody>'+bd.map(function(r){return '<tr>'+r.split('|').slice(1,-1)
            .map(function(c){return '<td>'+inl(c.trim())+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table>');}
        continue;}
      var ul=l.match(/^\s*[-*]\s+(.*)$/),ol=l.match(/^\s*\d+\.\s+(.*)$/);
      if(ul){if(!inUl){cl();out.push('<ul>');inUl=true;}out.push('<li>'+inl(ul[1])+'</li>');continue;}
      if(ol){if(!inOl){cl();out.push('<ol>');inOl=true;}out.push('<li>'+inl(ol[1])+'</li>');continue;}
      cl();out.push('<p>'+inl(l)+'</p>');}
    cl();if(inPre)out.push('<pre>'+esc(pre.join('\n'))+'</pre>');
    return out.join('\n');
  }

  /* ══════ 只读节点图：自上而下分层 · 端口级锚点 · 不可编辑 ══════ */
  function renderGraph(flow){
    var NS='http://www.w3.org/2000/svg';
    var nodes=(flow.nodes||[]).slice();
    var byId={}; nodes.forEach(function(n){ byId[n.id]=n; });
    if(!nodes.length) return;

    var E=[];
    nodes.forEach(function(n){
      (n.outputs||[]).forEach(function(o,oi){
        (o.to||[]).forEach(function(t){
          if(byId[t.node]) E.push({f:n.id, fi:oi, ft:o.port, t:t.node, tt:t.port,
                                   inj:o.inject||'', loop:t.loop||null});
        });
      });
      if(n.type==='note') (n.attached_to||[]).forEach(function(a){
        if(byId[a.node]) E.push({f:n.id, att:true, t:a.node});
      });
    });
    var flowE=E.filter(function(e){ return !e.att && !e.loop; });   /* loop 回边不参与分层 */
    E.forEach(function(e){
      if(e.att) return;
      var ps=(byId[e.t].inputs||[]).map(function(x){ return x.port; });
      var k=ps.indexOf(e.tt); e.ti=(k<0?0:k);
    });

    /* 尺寸 */
    var BW=304, HDR=32, ROW=20, PADB=7, GAPX=54, GAPY=74, PAD=46;
    nodes.forEach(function(n){
      n._nin=(n.inputs||[]).length; n._nout=(n.outputs||[]).length;
      n._rows=Math.max(n._nin+n._nout,1);
      n._w=BW; n._h=HDR+n._rows*ROW+PADB;
    });

    /* 分层 */
    var lv={}, adj={}, indeg={};
    nodes.forEach(function(n){ lv[n.id]=0; adj[n.id]=[]; indeg[n.id]=0; });
    flowE.forEach(function(e){ adj[e.f].push(e.t); indeg[e.t]++; });
    for(var it=0; it<nodes.length+1; it++)
      nodes.forEach(function(u){ adj[u.id].forEach(function(v){
        if(lv[v] < lv[u.id]+1) lv[v]=lv[u.id]+1; }); });

    /* 挂靠型注释：跟到目标同一层；纯漂浮：单独放最后一行 */
    var maxLv=0; nodes.forEach(function(n){ if(lv[n.id]>maxLv) maxLv=lv[n.id]; });
    nodes.forEach(function(n){
      if(n.type!=='note') return;
      var hasOut=(n.outputs||[]).length>0;
      var att=(n.attached_to||[]).length>0;
      if(!hasOut && att){ lv[n.id]=lv[n.attached_to[0].node]||0; }
      else if(!hasOut && !att){ lv[n.id]=maxLv+1; }
    });

    var rows={};
    nodes.forEach(function(n){ (rows[lv[n.id]]=rows[lv[n.id]]||[]).push(n); });
    var rk=Object.keys(rows).map(Number).sort(function(a,b){ return a-b; });

    /* 重心排序，减少交叉 */
    function avgPre(n){
      var p=flowE.filter(function(e){ return e.t===n.id; }).map(function(e){ return byId[e.f]._y||0; });
      return p.length ? p.reduce(function(a,b){ return a+b; },0)/p.length : (n.seq*1e3);
    }
    function avgSuc(n){
      var p=flowE.filter(function(e){ return e.f===n.id; }).map(function(e){ return byId[e.t]._y||0; });
      return p.length ? p.reduce(function(a,b){ return a+b; },0)/p.length : (n.seq*1e3);
    }
    rk.forEach(function(k){ rows[k].forEach(function(n,i){ n._y=i*300; }); });
    for(var pass=0; pass<4; pass++){
      rk.forEach(function(k){ if(pass===0 && k===rk[0]) return;
        rows[k].sort(function(a,b){ return avgPre(a)-avgPre(b); }); });
      rk.slice().reverse().forEach(function(k){
        rows[k].sort(function(a,b){ return avgSuc(a)-avgSuc(b); }); });
      rk.forEach(function(k){ rows[k].forEach(function(n,i){ n._y=i*300; }); });
    }

    /* 落位 */
    var rowW={}, maxW=0;
    rk.forEach(function(k){
      var w=0; rows[k].forEach(function(n,i){ w += n._w + (i?GAPX:0); });
      rowW[k]=w; if(w>maxW) maxW=w;
    });
    var pos={}, y=PAD;
    rk.forEach(function(k){
      var list=rows[k], x=(maxW-rowW[k])/2+PAD, h=0;
      list.forEach(function(n){
        pos[n.id]={x:x, y:y, w:n._w, h:n._h};
        x += n._w+GAPX; if(n._h>h) h=n._h;
      });
      y += h+GAPY;
    });
    var TW=maxW+PAD*2, TH=y-GAPY+PAD;

    /* 循环成员：loop 边的两端，以及它们之间的路径节点 */
    var loopIds={};
    E.forEach(function(e){ if(e.loop){ loopIds[e.f]=1; loopIds[e.t]=1; } });
    var TYC={input:'#3a5a8c', model_call:'#2f6b5e', output:'#3a5a8c', note:'#6b4a8c', task:'#8a6d3b'};
    function cut(t,n){ t=String(t==null?'':t); return t.length>n ? t.slice(0,n-1)+'…' : t; }
    function mono(sz,f){ return 'font-family="JetBrains Mono,Consolas,monospace" font-size="'+sz+'" fill="'+f+'"'; }
    function san(sz,f,w){ return 'font-family="Noto Sans SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="'+sz+'" fill="'+f+'"'
      + (w?' font-weight="'+w+'"':''); }

    var g=[];
    g.push('<svg id="dag" xmlns="'+NS+'" viewBox="0 0 '+TW+' '+TH+'" width="'+TW+'" height="'+TH+'" style="display:block">');
    g.push('<defs>'
      + '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">'
      +   '<path d="M0,0 L10,5 L0,10 z" fill="#a9a396"/></marker>'
      + '<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">'
      +   '<path d="M0,0 L10,5 L0,10 z" fill="#b3562e"/></marker>'
      + '<marker id="ahG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">'
      +   '<path d="M0,0 L10,5 L0,10 z" fill="#b9b3a4"/></marker>'
      + '<marker id="ahL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">'
      +   '<path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker></defs>');

    /* 连线：端口级锚点，纵向三次贝塞尔 */
    E.forEach(function(e){
      var a=pos[e.f], b=pos[e.t]; if(!a||!b) return;
      var x1,y1,x2,y2;
      if(e.att){
        x1=a.x+a.w/2; y1=a.y;
        x2=b.x+b.w/2; y2=b.y;
      } else {
        var no=(byId[e.f].outputs||[]).length||1;
        x1=a.x + a.w*(e.fi+1)/(no+1); y1=a.y+a.h;
        var ni=(byId[e.t].inputs||[]).length||1;
        x2=b.x + b.w*(e.ti+1)/(ni+1); y2=b.y;
      }
      var my=(y1+y2)/2, k=Math.max(22,(y2-y1)*0.42);
      var d='M'+x1.toFixed(1)+','+y1.toFixed(1)+' C'+x1.toFixed(1)+','+(y1+k).toFixed(1)
            +' '+x2.toFixed(1)+','+(y2-k).toFixed(1)+' '+x2.toFixed(1)+','+y2.toFixed(1);
      var isLoop=!!e.loop;
      if(isLoop){
        /* 回边：从右侧绕出去，画成大弧 —— 一眼看出是循环 */
        var bulge=Math.max(150, Math.min(TW-(a.x+a.w)-20, 260));
        d='M'+x1.toFixed(1)+','+y1.toFixed(1)
          +' C'+(x1+bulge).toFixed(1)+','+(y1+40).toFixed(1)
          +' '+(x2+bulge).toFixed(1)+','+(y2-40).toFixed(1)
          +' '+x2.toFixed(1)+','+y2.toFixed(1);
      }
      var stroke=isLoop?'#c2410c':(e.att?'#cec7b6':(e.inj?'#b3562e':'#a9a396'));
      var mk=isLoop?'ahL':(e.att?'ahG':(e.inj?'ahA':'ah'));
      g.push('<path class="eg" data-s="'+esc(e.f)+'" data-t="'+esc(e.t)+'" d="'+d+'" fill="none" stroke="'+stroke
        +'" stroke-width="'+(isLoop?2.6:(e.inj?2:1.6))+'"'
        +((e.att||isLoop)?' stroke-dasharray="7 5"':'')
        +' marker-end="url(#'+mk+')"/>');
      if(isLoop){
        var lk=(e.loop.kind||'loop'), lov=(e.loop.over||'');
        var lx=(x1+bulge*0.72), ly=(y1+y2)/2;
        g.push('<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="middle" '
          +mono(11,'#c2410c')+' font-weight="600">↺ '+esc(lk)+(lov?' · '+esc(cut(lov,20)):'')+'</text>');
      } else if(!e.att){
        g.push('<text x="'+((x1+x2)/2).toFixed(1)+'" y="'+((y1+y2)/2).toFixed(1)+'" text-anchor="middle" '
          +mono(10.5,'#8a8578')+'>'+esc(e.ft)+' → '+esc(e.tt)+'</text>');
      }
    });

    /* 节点 */
    nodes.forEach(function(n){
      var p=pos[n.id]; if(!p) return;
      var c=TYC[n.type]||'#8a8578';
      g.push('<g class="ng" data-id="'+esc(n.id)+'">');
      g.push('<rect x="'+p.x+'" y="'+(p.y+3)+'" width="'+p.w+'" height="'+p.h+'" rx="6" fill="rgba(28,26,22,.05)"/>');
      g.push('<rect x="'+p.x+'" y="'+p.y+'" width="'+p.w+'" height="'+p.h+'" rx="6" fill="#fffdf9" stroke="#d5cfbe" stroke-width="1.2"/>');
      g.push('<path d="M'+(p.x+6)+','+p.y+' h'+(p.w-12)+' a6,6 0 0 1 6,6 v20 h-'+(p.w)+' v-20 a6,6 0 0 1 6,-6 z" fill="'+c+'" opacity=".09"/>');
      g.push('<rect x="'+p.x+'" y="'+p.y+'" width="4.5" height="'+p.h+'" rx="2" fill="'+c+'"/>');
      g.push('<text x="'+(p.x+14)+'" y="'+(p.y+21)+'" '+mono(11,'#a9a396')+'>'+n.seq+'</text>');
      g.push('<text x="'+(p.x+33)+'" y="'+(p.y+21)+'" '+san(14,'#1c1a16',600)+'>'+esc(cut(n.label,17))+'</text>');
      g.push('<text x="'+(p.x+p.w-12)+'" y="'+(p.y+20)+'" text-anchor="end" '+mono(10,c)+'>'+esc(n.type)+'</text>');
      if(loopIds[n.id]) g.push('<text x="'+(p.x+p.w-12)+'" y="'+(p.y+p.h-6)+'" text-anchor="end" '+mono(9.5,'#c2410c')+'>↺ 循环成员</text>');
      g.push('<line x1="'+p.x+'" y1="'+(p.y+HDR-1)+'" x2="'+(p.x+p.w)+'" y2="'+(p.y+HDR-1)+'" stroke="#e6e2d6"/>');
      var yy=p.y+HDR+14;
      (n.inputs||[]).forEach(function(o){
        g.push('<text x="'+(p.x+13)+'" y="'+yy+'" '+mono(11.5,'#3a5a8c')+'>← '+esc(cut(o.port,11))+'</text>');
        g.push('<text x="'+(p.x+p.w-13)+'" y="'+yy+'" text-anchor="end" '+mono(10.5,'#a9a396')+'>'
          +esc(cut((o.from||[]).map(function(f){ return f.node; }).join(','),16))
          +(o.required===false?' ·可选':'')+(o.mode?' ·'+o.mode:'')+'</text>');
        yy+=ROW;
      });
      (n.outputs||[]).forEach(function(o){
        g.push('<text x="'+(p.x+13)+'" y="'+yy+'" '+mono(11.5,'#2f6b5e')+'>'+esc(cut(o.port,11))+' →</text>');
        g.push('<text x="'+(p.x+p.w-13)+'" y="'+yy+'" text-anchor="end" '+mono(10.5,'#a9a396')+'>'
          +esc(cut((o.to||[]).map(function(t){ return t.node; }).join(','),16))
          +(o.inject?' ·inject':'')+'</text>');
        yy+=ROW;
      });
      if(n.type==='note'){
        var tag=(n.outputs||[]).length ? ((n.attached_to||[]).length?'注入+挂靠':'注入提示词') : '挂靠展示';
        g.push('<text x="'+(p.x+13)+'" y="'+yy+'" '+mono(11,'#6b4a8c')+'>'+tag+'</text>');
      }
      g.push('</g>');
    });
    g.push('</svg>');

    var wrap=document.getElementById('tab-graph');
    wrap.innerHTML='<div class="pnote"><div class="ct">只读视图</div>'
      +'这是<b>不可编辑</b>的节点图。要改动就用右上角「用生成器打开」，或下载 JSON 后自行修改。'
      +'　<b>悬停节点会高亮它的连线。</b></div>'
      +'<div id="zbar">'
      +'  <button class="zbtn" data-z="1">100%</button>'
      +'  <button class="zbtn" data-z="fit">适应窗口</button>'
      +'  <button class="zbtn" data-z="-">− 缩小</button>'
      +'  <button class="zbtn" data-z="+">+ 放大</button>'
      +'  <span id="zinfo"></span>'
      +'</div>'
      +'<div id="dagshell">'+g.join('')+'</div>';

    var svgEl=wrap.querySelector('#dag'), shell=document.getElementById('dagshell');
    var NATW=TW, NATH=TH, z=1;
    shell.style.cssText='overflow:auto;max-height:78vh;border:1px solid var(--rule);'
      +'border-radius:4px;background:rgba(0,0,0,.012);padding:14px';
    var zbar=document.getElementById('zbar');
    zbar.style.cssText='display:flex;gap:7px;align-items:center;margin:12px 0 9px;flex-wrap:wrap';
    document.getElementById('zinfo').style.cssText='font-family:var(--mono);font-size:11px;color:var(--ink-3)';
    function applyZ(){
      if(!svgEl) return;
      svgEl.setAttribute('width', Math.round(NATW*z));
      svgEl.setAttribute('height', Math.round(NATH*z));
      document.getElementById('zinfo').textContent=Math.round(z*100)+'%　原始 '+NATW+'×'+NATH+'px';
    }
    [].forEach.call(zbar.querySelectorAll('.zbtn'), function(b){
      b.style.cssText='font-size:12.5px;padding:5px 13px;border:1px solid var(--rule);'
        +'background:var(--card);cursor:pointer;border-radius:2px;font-family:var(--sans)';
      b.addEventListener('click', function(){
        var d=b.dataset.z;
        if(d==='fit') z=Math.max(0.25, Math.min((shell.clientWidth-34)/NATW, (window.innerHeight*0.72)/NATH));
        else if(d==='1') z=1;
        else if(d==='+') z=Math.min(3, z*1.25);
        else if(d==='-') z=Math.max(0.25, z/1.25);
        applyZ();
      });
    });
    applyZ();

    /* 悬停高亮 */
    if(!svgEl) return;
    [].forEach.call(svgEl.querySelectorAll('.ng'), function(gn){
      gn.addEventListener('mouseenter', function(){
        var id=gn.dataset.id;
        [].forEach.call(svgEl.querySelectorAll('.eg'), function(p){
          var on=(p.dataset.s===id||p.dataset.t===id);
          p.style.opacity=on?'1':'.10'; p.style.strokeWidth=on?'3':'1.6';
        });
        [].forEach.call(svgEl.querySelectorAll('.ng'), function(o){
          o.style.opacity=(o.dataset.id===id)?'1':'.35'; });
        gn.style.opacity='1';
      });
      gn.addEventListener('mouseleave', function(){
        [].forEach.call(svgEl.querySelectorAll('.eg'), function(p){ p.style.opacity='1'; p.style.strokeWidth=''; });
        [].forEach.call(svgEl.querySelectorAll('.ng'), function(o){ o.style.opacity='1'; });
      });
    });
  }

  function nodes(flow){
    return (flow.nodes||[]).slice().sort(function(a,b){return a.seq-b.seq;}).map(function(n){
      var h='<div class="node"><div class="node-head"><span class="node-seq">'+n.seq+'</span>'
        +'<span class="node-ty '+esc(n.type)+'">'+esc(n.type)+'</span>'
        +'<span class="node-lb">'+esc(n.label)+'</span>'
        +'<span style="margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)">'
        +esc(n.id)+(n.config&&n.config.provider&&n.config.provider.id?' · '+esc(n.config.provider.id):'')+'</span></div>'
        +'<div class="node-body">';
      if(n.type==='note'){
        h+='<div style="border-left:3px solid #6b4a8c;background:rgba(107,74,140,.05);padding:8px 11px;'
          +'font-size:12.8px;color:var(--ink-2)">'+esc(n.text)+'</div>';
        (n.attached_to||[]).forEach(function(a){
          h+='<div class="port"><span class="pn">挂靠</span><span>→ '+esc(a.node)
            +'</span><span class="opt">（不注入，只展示）</span></div>';});
        (n.outputs||[]).forEach(function(o){
          h+='<div class="port"><span class="pn">注入</span><span class="inj">'+esc(o.inject)+'</span>'
            +'<span>→ '+((o.to||[]).map(function(t){return esc(t.node)+'.'+esc(t.port);}).join('、')||'—')
            +'</span><span class="opt">（改这条=改行为）</span></div>';});
        if(!(n.attached_to||[]).length&&!(n.outputs||[]).length)
          h+='<div class="port"><span class="opt">纯漂浮 —— 不连任何节点</span></div>';
      } else {
        h+='<div>'+esc(n.does)+'</div>';
        if(n.note) h+='<div class="node-note">设计意图：'+esc(n.note)+'</div>';
        if(n.annotations&&n.annotations.length)
          h+='<div class="node-note" style="border-left-color:#6b4a8c">挂靠的注释：'+n.annotations.map(esc).join('、')+'</div>';
        (n.inputs||[]).forEach(function(p){
          h+='<div class="port"><span>←</span><span class="pn">'+esc(p.port)+'</span>'
            +'<span class="'+(p.required===false?'opt':'req')+'">'+(p.required===false?'可选':'必填')+'</span>'
            +(p.mode?'<span class="mdm">mode:'+esc(p.mode)+'</span>':'')
            +(p.inject?'<span class="inj">inject:'+esc(p.inject)+'</span>':'')
            +'<span>'+((p.from||[]).map(function(f){return esc(f.node)+'.'+esc(f.port);}).join(' + ')||'—')+'</span>'
            +(p.carries?'<span class="opt">'+esc(p.carries)+'</span>':'')+'</div>';});
        (n.outputs||[]).forEach(function(p){
          h+='<div class="port"><span class="pn">'+esc(p.port)+'</span><span>→</span>'
            +'<span>'+((p.to||[]).map(function(t){return esc(t.node)+'.'+esc(t.port);}).join('、')||'（无）')+'</span>'
            +(p.carries?'<span class="opt">'+esc(p.carries)+'</span>':'')+'</div>';});
      }
      return h+'</div></div>';
    }).join('');
  }
  var gflow=null;
  document.getElementById('p-copy').addEventListener('click',function(){
    if(!gflow) return;
    var txt=JSON.stringify(gflow,null,2);
    if(navigator.clipboard) navigator.clipboard.writeText(txt).then(function(){alert('已复制流谱格式 JSON（'+txt.length+' 字符）');});
    else { var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); alert('已复制'); }
  });
  var tbs=[].slice.call(document.querySelectorAll('.tabs button'));
  tbs.forEach(function(b){b.addEventListener('click',function(){
    tbs.forEach(function(x){x.classList.remove('on');});b.classList.add('on');
    ['graph','readme','raw','meta'].forEach(function(k){
      document.getElementById('tab-'+k).hidden=(k!==b.dataset.t);});});});

  if(!ID){document.getElementById('p-head').innerHTML='<div class="pnote">缺少 ?id= 参数</div>';return;}
  var base='/library/pipelines/'+encodeURIComponent(ID)+'/';
  Promise.all([
    fetch('registry.json',{cache:'no-store'}).then(function(r){return r.json();}),
    fetch(base+'pipeline.flow.json',{cache:'no-store'}).then(function(r){
      if(!r.ok) throw new Error('pipeline.flow.json → HTTP '+r.status);return r.json();}),
    fetch(base+'meta.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():{};}).catch(function(){return{};}),
    fetch(base+'README.md',{cache:'no-store'}).then(function(r){return r.ok?r.text():'';}).catch(function(){return'';})
  ]).then(function(a){
    var reg=a[0],flow=a[1],meta=a[2],readme=a[3];
    var e=(reg.pipelines||[]).filter(function(p){return p.id===ID;})[0]||{};
    var I=flow.identity||{},A=flow.about||{},s=e.stats||{};
    gflow=flow;
    document.title=(I.name||ID)+' · 流谱';
    document.getElementById('p-name').textContent=I.name||ID;
    document.getElementById('p-stats').innerHTML='<span><b>'+s.nodes+'</b> 节点</span>'
      +'<span><b>'+s.edges+'</b> 连线</span><span><b>'+s.models+'</b> 模型</span>'
      +(s.notes?'<span><b>'+s.notes+'</b> 注释</span>':'');
    document.getElementById('p-gen').href='orchestrator/?open='+encodeURIComponent('/library/pipelines/'+ID+'/pipeline.flow.json');
    document.getElementById('p-head').innerHTML=
      '<div class="hot-card" style="cursor:default"><div class="hot-head">'
      +'<div class="hot-name"><span></span>'+esc(I.name||ID)+'</div>'
      +'<div class="hot-go">'+(e.category?esc(e.category):'')+' · v'+esc(I.version||'—')+'</div></div>'
      +'<div class="hot-desc">'+esc(A.summary||'')+'</div>'
      +'<div class="hot-tags"><span>id '+esc(ID)+'</span>'
      +(I.author?'<span>'+esc(I.author)+'</span>':'')
      +(I.license?'<span>'+esc(I.license)+'</span>':'')
      +((A.requires||[]).map(function(x){return '<span>'+esc(x)+'</span>';}).join(''))
      +'</div></div>'
      +'<div class="pnote"><div class="ct">用生成器打开</div>在画布上看这条管线的节点与连线，可二次编辑：'
      +'<a target="_blank" rel="noopener" href="orchestrator/?open='
      +encodeURIComponent('/library/pipelines/'+ID+'/pipeline.flow.json')+'">打开工作流生成器 →</a></div>';
    renderGraph(flow);
    document.getElementById('p-dl').href=base+'pipeline.flow.json';
    document.getElementById('p-dl').setAttribute('download', ID+'.flow.json');
    document.getElementById('tab-readme').innerHTML='<div class="doc-box">'+md(readme)+'</div>';
    document.getElementById('tab-raw').innerHTML='<div class="doc-box"><p style="font-size:12.5px;color:var(--ink-3)">'
      +'路径 <code>'+esc(base+'pipeline.flow.json')+'</code> · '
      +'<a href="'+esc(base+'pipeline.flow.json')+'" target="_blank">在新标签打开 →</a></p><pre>'
      +esc(JSON.stringify(flow,null,2))+'</pre></div>';
    document.getElementById('tab-meta').innerHTML='<div class="doc-box"><pre>'
      +esc(JSON.stringify(meta,null,2))+'</pre></div>';
  }).catch(function(err){
    document.getElementById('p-head').innerHTML='<div class="pnote"><div class="ct">载入失败</div>'
      +'读不到这条管线（id = <code>'+esc(ID)+'</code>）：'+esc(err.message)
      +'<br><br><a href="./">← 回管线库</a></div>';
  });
})();
</script>
</body>
</html>
